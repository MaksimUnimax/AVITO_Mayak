name: RF24 unsupported filter

on:
  push:
    branches: [rf24-unsupported-filter-scenario-01]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
          POSTGRES_DB: mayak
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_VERSION: 0.11.31
      MAYAK_PROVIDER_MODE: disabled
      DOCKER_HOST: unix:///var/run/docker.sock
      MAYAK_DATABASE_HOST: postgres
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      MAYAK_RUNTIME_PROFILE: synthetic_acceptance
      MAYAK_API_HOST_PORT: disabled
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      PYTHONPATH: .
      MAYAK_PROCESS_KIND: mayak-worker
      MAYAK_SYNTHETIC_IDENTITY_ENABLED: "true"
      MAYAK_RF11_POSTGRES_PASSWORD_FILE: /run/secrets/mayak_database_migration_password
      MAYAK_RF11_POSTGRES_USER: mayak_migration
      MAYAK_RF11_POSTGRES_HOST: postgres
      MAYAK_RF11_POSTGRES_PORT: "5432"
      MAYAK_RF11_POSTGRES_DB: mayak
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends git postgresql-client
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: H0 exact checkout and shell proof
        run: |
          set -euo pipefail
          git config --global --unset-all safe.directory || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -c 'set -euo pipefail; true'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31
      - name: H1 frozen dependency sync
        run: uv sync --frozen --all-groups
      - name: H2 bootstrap PostgreSQL roles and synthetic secrets
        run: |
          set -euo pipefail
          install -d -m 700 /run/secrets
          printf '%s\n' migration-only > /run/secrets/mayak_database_migration_password
          printf '%s\n' application-only > /run/secrets/mayak_database_application_password
          printf '%s\n' session-signing-key-acceptance-only > /run/secrets/mayak_session_signing_key
          chmod 600 /run/secrets/*
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE mayak_migration LOGIN CREATEDB PASSWORD 'migration-only';
          CREATE ROLE mayak_application LOGIN PASSWORD 'application-only';
          CREATE SCHEMA mayak AUTHORIZATION mayak_migration;
          GRANT USAGE, CREATE ON SCHEMA mayak TO mayak_application;
          SQL
          {
            echo "MAYAK_SOURCE_SHA=$GITHUB_SHA"
            echo "MAYAK_LOCK_IDENTITY=$(sha256sum uv.lock | cut -d' ' -f1)"
            echo "MAYAK_IMAGE_DIGEST=sha256:$(sha256sum Dockerfile | cut -d' ' -f1)"
            echo "MAYAK_ENVIRONMENT_ID=avito-mayak-rf24-unsupported-filter-${GITHUB_RUN_ID}"
            echo "MAYAK_API_HOST_PORT=disabled"
            echo "MAYAK_RF11_POSTGRES_PASSWORD_FILE=/run/secrets/mayak_database_migration_password"
            echo "MAYAK_RF11_POSTGRES_USER=mayak_migration"
            echo "MAYAK_RF11_POSTGRES_HOST=postgres"
            echo "MAYAK_RF11_POSTGRES_PORT=5432"
            echo "MAYAK_RF11_POSTGRES_DB=mayak"
            echo "MAYAK_RF10_POSTGRES_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
            echo "MAYAK_RF11_POSTGRES_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF10_POSTGRES_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
            echo "RF11_POSTGRES_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF15_MIGRATION_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF24_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
          } >> "$GITHUB_ENV"
      - name: H3 workflow and ownership guards
        run: |
          set -euo pipefail
          # Scenario contract: SYNTHETIC_UNSUPPORTED_FIELD -> FIELD_UNSUPPORTED -> DRAFT_UNSUPPORTED;
          # SCALAR_FIELD is the same-catalog VALID/PREPARED positive control.
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF11_POSTGRES_DSN MAYAK_RF10_POSTGRES_PASSWORD_FILE MAYAK_RF11_POSTGRES_PASSWORD_FILE MAYAK_RF10_POSTGRES_USER MAYAK_RF10_POSTGRES_HOST MAYAK_RF10_POSTGRES_PORT MAYAK_RF10_POSTGRES_DB MAYAK_RF11_POSTGRES_USER MAYAK_RF11_POSTGRES_HOST MAYAK_RF11_POSTGRES_PORT MAYAK_RF11_POSTGRES_DB
          export MAYAK_SOURCE_SHA="$(git rev-parse --verify HEAD)"
          export MAYAK_LOCK_IDENTITY="$(sha256sum uv.lock | cut -d' ' -f1)"
          export MAYAK_IMAGE_DIGEST="sha256:$(sha256sum Dockerfile | cut -d' ' -f1)"
          export MAYAK_ENVIRONMENT_ID="avito-mayak-rf24-unsupported-filter-${GITHUB_RUN_ID}"
          export MAYAK_DATABASE_HOST="$(getent ahostsv4 postgres | awk 'NR==1 {print $1}')"
          test -n "$MAYAK_DATABASE_HOST"
          uv run python scripts/runtime/check_rf24_cross_account_runtime_settings.py
          # runtime-settings-preflight=PASS
          uv run python scripts/runtime/check_rf24_unsupported_filter_workflow.py .github/workflows/ci-rf24-unsupported-filter.yml
          uv run python scripts/runtime/check_rf24_unsupported_filter_ownership.py .
      - name: Install pinned Docker CLI and buildx before gates
        run: |
          set -euo pipefail
          export DOCKER_HOST=unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          python - <<'PY'
          import hashlib, tarfile, tempfile
          from pathlib import Path
          from urllib.request import urlopen
          with tempfile.TemporaryDirectory() as directory:
              archive = Path(directory) / "docker.tgz"
              with urlopen("https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz") as response:
                  archive.write_bytes(response.read())
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == "995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3"
              with tarfile.open(archive) as package:
                  member = package.extractfile(package.getmember("docker/docker"))
                  assert member
                  target = Path("/usr/local/bin/docker")
                  target.write_bytes(member.read())
                  target.chmod(0o755)
          PY
          install -d -m 755 /usr/libexec/docker/cli-plugins
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          target = Path("/usr/libexec/docker/cli-plugins/docker-buildx")
          with urlopen("https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64") as response:
              target.write_bytes(response.read())
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "dc8eaffbf29138123b4874d852522b12303c61246a5073fa0f025e4220317b1e"
          target.chmod(0o755)
          PY
          docker version
          docker buildx version | grep -F 'v0.31.1'
      - name: H4 migrate initial database
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;'
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -v ON_ERROR_STOP=1 -c 'REVOKE INSERT, UPDATE, DELETE ON mayak.filter_catalog_versions, mayak.filter_definitions, mayak.filter_options, mayak.filter_dependencies, mayak.filter_category_applicability, mayak.filter_evidence_references, mayak.filter_capability_profiles FROM mayak_application;'
      - name: H5 complete repository pytest
        run: uv run pytest -q --disable-warnings 2>&1 | tee rf24-unsupported-filter-full-pytest.log
      - name: Preserve full pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf24-unsupported-filter-full-pytest-diagnostic
          if-no-files-found: warn
          path: rf24-unsupported-filter-full-pytest.log
      - name: H6 create NEW post-suite database and migrate from zero
        run: |
          set -euo pipefail
          # Fresh database identity prefix: CREATE DATABASE mayak_rf24_unsupported_filter_
          db="mayak_rf24_unsupported_filter_${GITHUB_RUN_ID}"
          case "$db" in (*[!a-zA-Z0-9_]*|'') exit 1;; esac
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db OWNER mayak_migration"
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA mayak AUTHORIZATION mayak_migration;'
          export MAYAK_DATABASE_NAME="$db"
          export RF24_UNSUPPORTED_MIGRATION_DSN="postgresql+psycopg://mayak_migration:migration-only@postgres:5432/$db"
          export MAYAK_RF11_POSTGRES_DSN="$RF24_UNSUPPORTED_MIGRATION_DSN"
          export MAYAK_RF10_POSTGRES_DSN="postgresql+psycopg://mayak_application:application-only@postgres:5432/$db"
          export RF11_POSTGRES_DSN="$MAYAK_RF11_POSTGRES_DSN" RF10_POSTGRES_DSN="$MAYAK_RF10_POSTGRES_DSN"
          export RF15_MIGRATION_DSN="$MAYAK_RF11_POSTGRES_DSN" RF24_DSN="$MAYAK_RF10_POSTGRES_DSN"
          export MAYAK_RF11_POSTGRES_DB="$db" MAYAK_RF11_POSTGRES_HOST="$MAYAK_DATABASE_HOST" MAYAK_RF11_POSTGRES_PORT=5432 MAYAK_RF11_POSTGRES_USER=mayak_migration
          printf '%s\n' "MAYAK_DATABASE_NAME=$MAYAK_DATABASE_NAME" "RF24_UNSUPPORTED_MIGRATION_DSN=$RF24_UNSUPPORTED_MIGRATION_DSN" "MAYAK_RF11_POSTGRES_DSN=$MAYAK_RF11_POSTGRES_DSN" "MAYAK_RF10_POSTGRES_DSN=$MAYAK_RF10_POSTGRES_DSN" "RF11_POSTGRES_DSN=$RF11_POSTGRES_DSN" "RF10_POSTGRES_DSN=$RF10_POSTGRES_DSN" "RF15_MIGRATION_DSN=$RF15_MIGRATION_DSN" "RF24_DSN=$RF24_DSN" "MAYAK_RF11_POSTGRES_DB=$MAYAK_RF11_POSTGRES_DB" >> "$GITHUB_ENV"
          uv run alembic upgrade head
          uv run python -c 'import os; from sqlalchemy import create_engine, text; assert create_engine(os.environ["RF15_MIGRATION_DSN"]).connect().execute(text("select version_num from mayak.alembic_version")).scalar_one(); print("exact-head-proof=PASS")'
          echo fresh-db-current-shell-binding=PASS
      - name: H7 exact head and database identity proof
        run: |
          set -euo pipefail
          test "$MAYAK_DATABASE_NAME" != mayak
          uv run python -c 'from mayak.runtime.settings import load_runtime_settings; assert load_runtime_settings().database.name != "mayak"; print("database-b=PASS")'
      - name: H8 grant accepted application privileges and prove head
        run: |
          set -euo pipefail
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$MAYAK_DATABASE_NAME" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;'
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$MAYAK_DATABASE_NAME" -v ON_ERROR_STOP=1 -c 'REVOKE INSERT, UPDATE, DELETE ON mayak.filter_catalog_versions, mayak.filter_definitions, mayak.filter_options, mayak.filter_dependencies, mayak.filter_category_applicability, mayak.filter_evidence_references, mayak.filter_capability_profiles FROM mayak_application;'
          uv run python -c 'from mayak.runtime.settings import load_runtime_settings; print(load_runtime_settings().database.name)'
      - name: H9 final runtime settings proof
        run: |
          set -euo pipefail
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF10_POSTGRES_USER MAYAK_RF10_POSTGRES_HOST MAYAK_RF10_POSTGRES_PORT MAYAK_RF10_POSTGRES_DB
          export MAYAK_DATABASE_HOST="$(getent ahostsv4 postgres | awk 'NR==1 {print $1}')"
          echo "MAYAK_DATABASE_HOST=$MAYAK_DATABASE_HOST" >> "$GITHUB_ENV"
          test "$MAYAK_DATABASE_NAME" != mayak
          test "$MAYAK_AVITO_LIVE_ENABLED" = false
          uv run python -c 'from mayak.runtime.settings import load_runtime_settings; s=load_runtime_settings(); assert s.providers.avito_live_enabled is False; print("runtime-settings=PASS")'
      - name: H10 U0-U10 real PostgreSQL scenario
        run: |
          set -euo pipefail
          export RF22_DSN="$MAYAK_RF10_POSTGRES_DSN"
          export RF22_DATABASE_URL="$MAYAK_RF10_POSTGRES_DSN"
          export RF22_MIGRATION_DSN="$MAYAK_RF11_POSTGRES_DSN"
          mkdir -p artifacts
          uv run python scripts/runtime/run_rf24_unsupported_filter.py --real-postgres --artifacts artifacts
      - name: H11 verifier
        run: uv run python scripts/runtime/verify_rf24_unsupported_filter.py artifacts/rf24-unsupported-filter-evidence.json --source-sha "$MAYAK_SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: H12 artifact safety scanner
        run: uv run python scripts/runtime/check_rf24_unsupported_filter_artifact_safety.py artifacts --result artifacts/rf24-unsupported-filter-scanner-result.json
      - name: H13 deterministic manifest
        run: uv run python scripts/runtime/build_rf24_unsupported_filter_manifest.py artifacts --source-sha "$MAYAK_SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --output artifacts/rf24-unsupported-filter-safety-manifest.json
      - name: H14 upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf24-unsupported-filter
          path: artifacts/rf24-unsupported-filter*
