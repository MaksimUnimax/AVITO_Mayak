name: RF-12 Hosted PostgreSQL Acceptance

on:
  push:
    branches:
      - 'rf12-acceptance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf12-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  NO_COLOR: "1"
  UV_NO_SYSTEM_CONFIG: "1"
  UV_PROJECT_ENVIRONMENT: .venv
  PG_IMAGE: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
  RF12_TECHNICAL_ID: RF-12-CORRECTIVE-VERIFIER-FAIL-CLOSED-AND-EVIDENCE-IDENTITY-CLOSURE-20260802-08

jobs:
  rf12-runtime-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Prove push identity and collect runner capacity
        run: |
          test "${{ github.sha }}" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p ci-evidence/rf12
          {
            echo "workflow_run=${{ github.run_id }}"
            echo "event=${{ github.event_name }}"
            echo "candidate_sha=${{ github.sha }}"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "free_bytes=$(df -B1 --output=avail . | tail -1 | tr -d ' ')"
            echo "free_inodes=$(df -Pi . | awk 'NR==2 {print $4}')"
            echo "docker_root=$(docker info --format '{{.DockerRootDir}}')"
            docker system df
            docker info --format 'docker_server={{.ServerVersion}}'
          } > ci-evidence/rf12/runner-capacity.txt
          test "$(df -B1 --output=avail . | tail -1 | tr -d ' ')" -ge 1934900000
          test "$(df -Pi . | awk 'NR==2 {print $4}')" -ge 100000
          docker system df >> ci-evidence/rf12/runner-capacity.txt

      - name: Setup pinned Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.31
          python-version: 3.14.6
          activate-environment: true
          venv-path: .venv
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --frozen --all-groups --python 3.14.6

      - name: Verify immutable dependency identity
        run: |
          test "$(sha256sum pyproject.toml | cut -d' ' -f1)" = 5b0727b99214d58c9fab83a6567b9485afca34a93ba0358a7bbd6ea04f7dcb7d
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = e1faff1ce0f4d5dfd35480ab59d5d599fddf05c38fcd16a26c52098511476ab6
          test "$(python --version)" = "Python 3.14.6"
          test "$(uv --version | awk '{print $2}')" = "0.11.31"

      - name: Compile RF-12 sources
        run: python -m compileall -q src scripts/runtime/run_rf12_postgres_acceptance.py scripts/runtime/verify_rf12_acceptance.py scripts/runtime/finalize_rf12_acceptance_evidence.py scripts/runtime/run_rf12_tamper_matrix.py

      - name: Run RF-12 focused unit tests
        run: uv run pytest -q tests/runtime/test_rf12_command_matrix.py tests/runtime/test_rf12_runtime_postgres.py tests/runtime/test_rf12_persistence_injection.py tests/runtime/test_rf12_finalizer.py tests/runtime/test_rf12_verifier_schema.py tests/runtime/test_rf12_tamper_matrix.py tests/runtime/test_rf12_phase_ownership.py tests/runtime/test_rf12_usage_policy_contract.py tests/runtime/test_rf12_workflow_inventory.py tests/unit/test_entitlements_and_billing_contracts.py tests/unit/test_usage_consumption_semantics.py tests/runtime/test_entitlements_schema.py

      - name: Run RF-12 Ruff gate
        run: uv run ruff check alembic/env.py alembic/versions/20260802_RF12_BASIC_BEACON_LIMIT.py scripts/runtime/run_rf12_postgres_acceptance.py scripts/runtime/verify_rf12_acceptance.py scripts/runtime/finalize_rf12_acceptance_evidence.py scripts/runtime/run_rf12_tamper_matrix.py src/mayak/modules/entitlements_and_billing/contracts.py src/mayak/modules/entitlements_and_billing/policies.py src/mayak/modules/entitlements_and_billing/runtime.py src/mayak/modules/entitlements_and_billing/usage_consumption.py src/mayak/persistence/config.py src/mayak/persistence/schema/entitlements.py tests/runtime/test_entitlements_schema.py tests/runtime/test_rf12_command_matrix.py tests/runtime/test_rf12_runtime_postgres.py tests/runtime/test_rf12_persistence_injection.py tests/runtime/test_rf12_finalizer.py tests/runtime/test_rf12_verifier_schema.py tests/runtime/test_rf12_tamper_matrix.py tests/runtime/test_rf12_phase_ownership.py tests/runtime/test_rf12_usage_policy_contract.py tests/runtime/test_rf12_workflow_inventory.py tests/unit/test_entitlements_and_billing_contracts.py tests/unit/test_usage_consumption_semantics.py

      - name: Run RF-12 mypy gate
        run: uv run mypy --follow-imports=skip --ignore-missing-imports src/mayak/modules/entitlements_and_billing/contracts.py src/mayak/modules/entitlements_and_billing/policies.py src/mayak/modules/entitlements_and_billing/runtime.py src/mayak/modules/entitlements_and_billing/usage_consumption.py src/mayak/persistence/config.py src/mayak/persistence/schema/entitlements.py scripts/runtime/run_rf12_postgres_acceptance.py scripts/runtime/verify_rf12_acceptance.py scripts/runtime/finalize_rf12_acceptance_evidence.py scripts/runtime/run_rf12_tamper_matrix.py

      - name: Run import-linter gate
        run: uv run lint-imports

      - name: Build exactly one candidate application image
        run: |
          LOCK_IDENTITY="$(sha256sum uv.lock | cut -d' ' -f1)"
          BUILD_INPUT_DIGEST="$(git ls-files -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "LOCK_IDENTITY=$LOCK_IDENTITY" >> "$GITHUB_ENV"
          echo "BUILD_INPUT_DIGEST=$BUILD_INPUT_DIGEST" >> "$GITHUB_ENV"
          docker build --pull=false --tag rf12-candidate:${{ github.sha }} \
            --build-arg SOURCE_SHA=${{ github.sha }} \
            --build-arg LOCK_IDENTITY="$LOCK_IDENTITY" \
            --build-arg BUILD_INPUT_DIGEST="$BUILD_INPUT_DIGEST" .
          docker image inspect rf12-candidate:${{ github.sha }} --format '{{json .}}' | python -c 'import json,sys; x=json.load(sys.stdin); print(json.dumps({"id":x["Id"],"labels":x["Config"]["Labels"]},sort_keys=True))' > ci-evidence/rf12/image-identity.json

      - name: Record normalized foreign Docker snapshot before task resources
        run: |
          python - <<'PY'
          import json, os, subprocess
          def rows(command):
              out = subprocess.check_output(command, text=True)
              return sorted((json.loads(line) for line in out.splitlines() if line.strip()), key=lambda item: json.dumps(item, sort_keys=True))
          snapshot = {
              "containers": rows(["docker", "ps", "-a", "--format", "{{json .}}"]),
              "networks": rows(["docker", "network", "ls", "--format", "{{json .}}"]),
              "volumes": rows(["docker", "volume", "ls", "--format", "{{json .}}"]),
          }
          json.dump(snapshot, open("ci-evidence/rf12/foreign-before.json", "w"), sort_keys=True)
          PY

      - name: Start one private PostgreSQL 18 cluster
        run: |
          docker network create rf12-acceptance-network
          docker volume create rf12-acceptance-pgdata
          docker run --detach --name rf12-acceptance-postgres --network rf12-acceptance-network \
            --volume rf12-acceptance-pgdata:/var/lib/postgresql \
            --env POSTGRES_USER=rf12 --env POSTGRES_PASSWORD=rf12 --env POSTGRES_DB=postgres "$PG_IMAGE"
          ready=0
          for i in $(seq 1 180); do
            if docker exec rf12-acceptance-postgres pg_isready -h 127.0.0.1 -U rf12; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker ps -a --no-trunc
            docker inspect rf12-acceptance-postgres --format '{{json .State}}'
            docker logs rf12-acceptance-postgres
            exit 1
          fi
          for db in rf12_empty rf12_rf09 rf12_manual rf12_runtime_harden rf12_final; do
            docker exec rf12-acceptance-postgres createdb -U rf12 "$db"
          done
          DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          docker exec rf12-acceptance-postgres psql -U rf12 -d postgres -v ON_ERROR_STOP=1 \
            -v pw="$DB_PASSWORD" \
            -c "CREATE ROLE mayak_migration LOGIN PASSWORD '$DB_PASSWORD'" \
            -c "CREATE ROLE mayak_application LOGIN PASSWORD '$DB_PASSWORD'"
          for db in rf12_empty rf12_rf09 rf12_manual rf12_runtime_harden rf12_final; do
            docker exec rf12-acceptance-postgres psql -U rf12 -d "$db" -v ON_ERROR_STOP=1 \
              -c 'CREATE SCHEMA mayak AUTHORIZATION mayak_migration'
          done

      - name: Preflight candidate image to PostgreSQL
        run: |
          DB_DSN="postgresql+psycopg://mayak_migration:${DB_PASSWORD}@rf12-acceptance-postgres:5432/rf12_final"
          docker run --rm --network rf12-acceptance-network \
            --env RF12_PREFLIGHT_DSN="$DB_DSN" \
            rf12-candidate:${{ github.sha }} \
            python - <<'PY'
          import json, os, psycopg
          try:
              psycopg.connect(os.environ["RF12_PREFLIGHT_DSN"]).close()
          except Exception as exc:
              print("::error title=RF12 preflight::" + json.dumps({"exception_type": type(exc).__name__, "sqlstate": getattr(exc, "sqlstate", None)}, sort_keys=True))
              raise
          PY

      - name: Run real RF-12 PostgreSQL acceptance producer
        run: |
          chmod 0777 ci-evidence/rf12
          DB_DSN="postgresql+psycopg://mayak_migration:${DB_PASSWORD}@rf12-acceptance-postgres:5432"
          set +e
          producer_output="$(docker run --rm --network rf12-acceptance-network \
            --volume "$PWD/ci-evidence/rf12:/evidence" \
            rf12-candidate:${{ github.sha }} \
            python /opt/mayak/scripts/runtime/run_rf12_postgres_acceptance.py \
            --dsn "${DB_DSN}/rf12_final" \
            --migration-dsn "${DB_DSN}/rf12_final" \
            --empty-dsn "${DB_DSN}/rf12_empty" \
            --rf09-dsn "${DB_DSN}/rf12_rf09" \
            --manual-dsn "${DB_DSN}/rf12_manual" \
            --runtime-harden-dsn "${DB_DSN}/rf12_runtime_harden" \
            --artifact /evidence/rf12-acceptance.json \
            --candidate-sha "${{ github.sha }}" \
            --technical-id "$RF12_TECHNICAL_ID" \
            --candidate-tree "$(git rev-parse HEAD^{tree})" \
            --image-identity "$(docker image inspect rf12-candidate:${{ github.sha }} --format '{{.Id}}')" \
            --image-provenance "$(cat ci-evidence/rf12/image-identity.json)" \
            --lock-identity "$LOCK_IDENTITY" \
            --build-input-identity "$BUILD_INPUT_DIGEST" \
            2>&1)"
          producer_status=$?
          printf '%s\n' "$producer_output"
          set -e
          if [ "$producer_status" -ne 0 ]; then
            producer_type="$(printf '%s\n' "$producer_output" | sed -n 's/.*failed closed: //p' | tail -1)"
            producer_line="$(printf '%s\n' "$producer_output" | sed -E 's#postgresql\+psycopg://[^ ]+#<redacted-dsn>#g' | tail -1)"
            echo "::error title=RF12 producer container exit::exit_code=$producer_status exception_type=${producer_type:-unknown} output=${producer_line:-empty}"
            exit "$producer_status"
          fi

      - name: Publish safe producer diagnostic
        if: always()
        run: |
          if [ -f ci-evidence/rf12/producer-failure.json ]; then
            cat ci-evidence/rf12/producer-failure.json
            cat ci-evidence/rf12/producer-failure.json >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=RF12 producer diagnostic::$(tr -d '\n' < ci-evidence/rf12/producer-failure.json)"
          fi

      - name: Remove task resources and prove cleanup
        if: always()
        run: |
          docker inspect rf12-acceptance-postgres > ci-evidence/rf12/task-container-before.json 2>/dev/null || true
          docker network inspect rf12-acceptance-network > ci-evidence/rf12/task-network-before.json 2>/dev/null || true
          docker volume inspect rf12-acceptance-pgdata > ci-evidence/rf12/task-volume-before.json 2>/dev/null || true
          docker image inspect rf12-candidate:${{ github.sha }} > ci-evidence/rf12/task-image-before.json 2>/dev/null || true
          docker rm -f rf12-acceptance-postgres 2>/dev/null || true
          docker volume rm rf12-acceptance-pgdata 2>/dev/null || true
          docker network rm rf12-acceptance-network 2>/dev/null || true
          docker image rm rf12-candidate:${{ github.sha }} 2>/dev/null || true
          python - <<'PY'
          import json, os, subprocess
          def rows(command):
              out = subprocess.check_output(command, text=True)
              return sorted((json.loads(line) for line in out.splitlines() if line.strip()), key=lambda item: json.dumps(item, sort_keys=True))
          snapshot = {
              "containers": rows(["docker", "ps", "-a", "--format", "{{json .}}"]),
              "networks": rows(["docker", "network", "ls", "--format", "{{json .}}"]),
              "volumes": rows(["docker", "volume", "ls", "--format", "{{json .}}"]),
          }
          task = [item for values in snapshot.values() for item in values if "rf12-acceptance" in json.dumps(item)]
          json.dump(snapshot, open("ci-evidence/rf12/foreign-after.json", "w"), sort_keys=True)
          inspect = lambda args: subprocess.run(args, capture_output=True, text=True).returncode != 0
          image_tag_absent = inspect(["docker", "image", "inspect", "rf12-candidate:${{ github.sha }}"])
          before_image = json.load(open("ci-evidence/rf12/task-image-before.json"))[0] if os.path.isfile("ci-evidence/rf12/task-image-before.json") and os.path.getsize("ci-evidence/rf12/task-image-before.json") else {}
          image_id = before_image.get("Id", "")
          retained = any(image_id == row.split()[0] for row in subprocess.check_output(["docker", "images", "--no-trunc", "--format", "{{.ID}} {{.Repository}}:{{.Tag}}"], text=True).splitlines() if row.split())
          container_absent = inspect(["docker", "inspect", "rf12-acceptance-postgres"])
          network_absent = inspect(["docker", "network", "inspect", "rf12-acceptance-network"])
          volume_absent = inspect(["docker", "volume", "inspect", "rf12-acceptance-pgdata"])
          json.dump({"task_resources_absent": not task, "remaining_task_resources": len(task), "container_name": "rf12-acceptance-postgres", "network_name": "rf12-acceptance-network", "volume_name": "rf12-acceptance-pgdata", "candidate_image_tag": "rf12-candidate:${{ github.sha }}", "candidate_image_id": image_id, "container_absent": container_absent, "container_remaining_count": int(not container_absent), "network_absent": network_absent, "network_remaining_count": int(not network_absent), "volume_absent": volume_absent, "volume_remaining_count": int(not volume_absent), "image_tag_absent": image_tag_absent, "image_tag_remaining_count": int(not image_tag_absent), "image_id_not_retained": not retained, "image_id_remaining_count": int(retained)}, open("ci-evidence/rf12/task-resource-absence.json", "w"), sort_keys=True)
          PY

      - name: Finalize post-cleanup RF-12 evidence
        if: success()
        run: |
          python scripts/runtime/finalize_rf12_acceptance_evidence.py \
            --runtime ci-evidence/rf12/rf12-acceptance.json \
            --before ci-evidence/rf12/foreign-before.json \
            --after ci-evidence/rf12/foreign-after.json \
            --absence ci-evidence/rf12/task-resource-absence.json \
            --output ci-evidence/rf12/rf12-acceptance-final.json
          mv ci-evidence/rf12/rf12-acceptance-final.json ci-evidence/rf12/rf12-acceptance.json

      - name: Run final independent verifier
        if: success()
        run: |
          set -o pipefail
          set +e
          python scripts/runtime/verify_rf12_acceptance.py . ci-evidence/rf12/rf12-acceptance.json "${{ github.sha }}" "$RF12_TECHNICAL_ID" 2>&1 | tee ci-evidence/rf12/verifier.txt
          verifier_status=${PIPESTATUS[0]}
          set -e
          if [ "$verifier_status" -ne 0 ]; then
            diagnostic="$(tr -d '\n' < ci-evidence/rf12/verifier.txt | cut -c1-240)"
            echo "::error title=RF12 verifier failed::exit_code=$verifier_status diagnostic=$diagnostic"
            exit "$verifier_status"
          fi
          grep -Fxq 'RF12_ACCEPTANCE_VERIFIED' ci-evidence/rf12/verifier.txt

      - name: Run tamper-negative matrix from accepted pristine baseline
        if: success()
        run: |
          set +e
          python scripts/runtime/run_rf12_tamper_matrix.py . ci-evidence/rf12/rf12-acceptance.json ci-evidence/rf12/tamper-negative.json "${{ github.sha }}" "$RF12_TECHNICAL_ID"
          tamper_status=$?
          set -e
          if [ "$tamper_status" -ne 0 ]; then
            diagnostic="$(tr -d '\n' < ci-evidence/rf12/tamper-negative.json | cut -c1-240)"
            echo "::error title=RF12 tamper matrix failed::exit_code=$tamper_status diagnostic=$diagnostic"
            exit "$tamper_status"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('ci-evidence/rf12/tamper-negative.json').read_text())
          assert result['pristine_accepted'] is True
          assert result['pristine_return_code'] == 0
          assert result['pristine_marker'] == 'RF12_ACCEPTANCE_VERIFIED'
          assert result['expected_technical_id'] == 'RF-12-CORRECTIVE-VERIFIER-FAIL-CLOSED-AND-EVIDENCE-IDENTITY-CLOSURE-20260802-08'
          assert result['expected_candidate_sha'] == '${{ github.sha }}'
          assert result['all_rejected'] is True
          PY

      - name: Publish bounded safe RF-12 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rf12-acceptance-${{ github.sha }}
          path: ci-evidence/rf12/
          retention-days: 30
          include-hidden-files: false
          if-no-files-found: error
