name: RF16 Egress Routing durable runtime acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rf16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: mayak, POSTGRES_PASSWORD: mayak, POSTGRES_DB: mayak}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RF16_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf16migration@127.0.0.1:5432/mayak
      RF16_APPLICATION_DSN: postgresql+psycopg://mayak_application:rf16application@127.0.0.1:5432/mayak
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14.6'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.11.31'}
      - run: uv sync --frozen
      - name: Create roles and migrate
        run: |
          docker ps --filter 'ancestor=postgres:18' --filter status=running --format '{{.ID}}' | grep -E '.+'
          docker exec "$(docker ps --filter 'ancestor=postgres:18' --filter status=running --format '{{.ID}}' | head -1)" psql -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE ROLE mayak_migration LOGIN PASSWORD 'rf16migration';" -c "CREATE ROLE mayak_application LOGIN PASSWORD 'rf16application';" -c "CREATE SCHEMA IF NOT EXISTS mayak AUTHORIZATION mayak_migration"
          RF16_DSN="$RF16_MIGRATION_DSN" uv run alembic upgrade head
          RF16_DSN="$RF16_MIGRATION_DSN" uv run python -c 'from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ["RF16_DSN"]); c=e.connect(); c.execute(text("GRANT USAGE ON SCHEMA mayak TO mayak_application")); c.execute(text("GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application")); c.commit()'
      - run: uv run pytest -q tests/contract/test_rf16_egress_runtime_contracts.py tests/contract/test_rf16_parser_egress_integration.py tests/architecture/test_egress_routing_boundaries.py tests/architecture/test_import_boundaries.py
      - run: uv run python scripts/runtime/build_rf16_agent.py
      - run: uv run python scripts/runtime/run_rf16_postgres_acceptance.py --dsn "$RF16_APPLICATION_DSN" --fixture-dsn "$RF16_MIGRATION_DSN" --output rf16-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rf16-postgres-acceptance, path: 'rf16-evidence.json'}
