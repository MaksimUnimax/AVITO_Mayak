name: rf24-expired-access

on:
  push:
    branches: [rf24-expired-access-scenario-01]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm@sha256:ec1b01f92099324b965a51c8547d9a3b71fedc99f6991a89662e7358f9b167c9
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: mayak
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      UV_VERSION: 0.11.31
      MAYAK_DATABASE_HOST: postgres
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      RF10_POSTGRES_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
      RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
      RF24_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      MAYAK_RF10_POSTGRES_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      MAYAK_RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
      MAYAK_RF11_POSTGRES_PASSWORD_FILE: /run/secrets/mayak_database_migration_password
      MAYAK_RF11_POSTGRES_USER: mayak_migration
      MAYAK_RF11_POSTGRES_HOST: postgres
      MAYAK_RF11_POSTGRES_PORT: "5432"
      MAYAK_RF11_POSTGRES_DB: mayak
      MAYAK_SECRETS_DIR: /run/secrets
      DOCKER_HOST: unix:///var/run/docker.sock
      MAYAK_RUNTIME_PROFILE: synthetic_acceptance
      MAYAK_API_BIND_HOST: 127.0.0.1
      MAYAK_API_HOST_PORT: disabled
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      PYTHONPATH: .
    steps:
      - name: Install git and PostgreSQL client
        run: apt-get update && apt-get install -y --no-install-recommends git postgresql-client
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source identity and Bash contract
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          command -v bash
          bash -c 'set -euo pipefail; printf "%s\n" bash-pipefail-ok'
          printf 'CHECKOUT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! git config --get-all safe.directory | grep -Fxq '*'
      - name: Prove container-native Python authority
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          printf 'CONTAINER_PYTHON=%s\n' "$python_path"
          test "$python_path" = /usr/local/bin/python
          case "$python_path" in
            /__t/*|*hostedtoolcache*) exit 1 ;;
          esac
          test "$(python --version 2>&1)" = "Python 3.14.6"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31
      - name: Re-check container-native Python after uv setup
        run: |
          set -euo pipefail
          python_path="$(command -v python)"
          test "$python_path" = /usr/local/bin/python
          case "$python_path" in
            /__t/*|*hostedtoolcache*) exit 1 ;;
          esac
          test "$(python --version 2>&1)" = "Python 3.14.6"
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Materialize and preflight runtime settings
        run: |
          set -euo pipefail
          export MAYAK_DATABASE_HOST="$(getent ahostsv4 postgres | awk 'NR==1 {print $1}')"
          test -n "$MAYAK_DATABASE_HOST"
          export MAYAK_ENVIRONMENT_ID="avito-mayak-rf24-expired-${GITHUB_RUN_ID}"
          export MAYAK_SOURCE_SHA="$GITHUB_SHA"
          export MAYAK_LOCK_IDENTITY="$(sha256sum uv.lock | cut -d' ' -f1)"
          export MAYAK_IMAGE_DIGEST="sha256:$(sha256sum Dockerfile | cut -d' ' -f1)"
          export MAYAK_PROCESS_KIND=mayak-worker
          export MAYAK_SYNTHETIC_IDENTITY_ENABLED=true
          export MAYAK_API_HOST_PORT=disabled
          {
            printf 'MAYAK_ENVIRONMENT_ID=%s\n' "$MAYAK_ENVIRONMENT_ID"
            printf 'MAYAK_SOURCE_SHA=%s\n' "$MAYAK_SOURCE_SHA"
            printf 'MAYAK_LOCK_IDENTITY=%s\n' "$MAYAK_LOCK_IDENTITY"
            printf 'MAYAK_IMAGE_DIGEST=%s\n' "$MAYAK_IMAGE_DIGEST"
            printf 'MAYAK_PROCESS_KIND=%s\n' "$MAYAK_PROCESS_KIND"
            printf 'MAYAK_SYNTHETIC_IDENTITY_ENABLED=%s\n' "$MAYAK_SYNTHETIC_IDENTITY_ENABLED"
            printf 'MAYAK_API_HOST_PORT=%s\n' "$MAYAK_API_HOST_PORT"
            printf 'MAYAK_DATABASE_HOST=%s\n' "$MAYAK_DATABASE_HOST"
          } >> "$GITHUB_ENV"
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF11_POSTGRES_DSN MAYAK_RF11_POSTGRES_PASSWORD_FILE MAYAK_RF11_POSTGRES_USER MAYAK_RF11_POSTGRES_HOST MAYAK_RF11_POSTGRES_PORT MAYAK_RF11_POSTGRES_DB
          uv run python - <<'PY'
          import hashlib
          import os
          from mayak.runtime.settings import load_runtime_settings

          settings = load_runtime_settings()
          assert settings.runtime.profile.value == "synthetic_acceptance"
          assert settings.build.source_sha == os.environ["GITHUB_SHA"]
          assert settings.build.environment_id == f"avito-mayak-rf24-expired-{os.environ['GITHUB_RUN_ID']}"
          assert settings.build.lock_identity == hashlib.sha256(open("uv.lock", "rb").read()).hexdigest()
          assert settings.build.image_digest == "sha256:" + hashlib.sha256(open("Dockerfile", "rb").read()).hexdigest()
          assert settings.runtime.process_kind.value == "mayak-worker"
          assert settings.session.synthetic_identity_enabled is True
          assert settings.database.application_user == "mayak_application"
          assert settings.database.migration_user == "mayak_migration"
          assert settings.database.application_user == "mayak_application"
          assert settings.database.migration_user == "mayak_migration"
          assert settings.providers.avito_live_enabled is False
          assert settings.providers.telegram_enabled is False
          assert settings.providers.max_enabled is False
          assert settings.providers.yookassa_enabled is False
          assert settings.providers.egress_agent_enabled is False
          assert settings.api.host_port is None
          print("runtime-settings-preflight=PASS")
          PY
      - name: Prepare non-empty acceptance secrets and PostgreSQL roles
        run: |
          set -euo pipefail
          install -d -m 700 /run/secrets
          printf '%s\n' migration-only > /run/secrets/mayak_database_migration_password
          printf '%s\n' application-only > /run/secrets/mayak_database_application_password
          printf '%s\n' session-signing-key-acceptance-only > /run/secrets/mayak_session_signing_key
          printf '%s\n' bootstrap-only > /run/secrets/mayak_postgres_bootstrap_password
          chmod 600 /run/secrets/mayak_database_migration_password /run/secrets/mayak_database_application_password /run/secrets/mayak_session_signing_key /run/secrets/mayak_postgres_bootstrap_password
          test -s /run/secrets/mayak_database_migration_password
          test -s /run/secrets/mayak_database_application_password
          test -s /run/secrets/mayak_session_signing_key
          test -s /run/secrets/mayak_postgres_bootstrap_password
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE mayak_migration LOGIN PASSWORD 'migration-only';
          CREATE ROLE mayak_application LOGIN PASSWORD 'application-only';
          ALTER ROLE mayak_migration CREATEDB;
          CREATE SCHEMA mayak AUTHORIZATION mayak_migration;
          GRANT USAGE, CREATE ON SCHEMA mayak TO mayak_application;
          SQL
          printf '%s\n' 'RF15_MIGRATION_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak' >> "$GITHUB_ENV"
      - name: Initial migration zero to head
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO mayak_application;'
      - name: Install hosted Docker CLI and buildx
        run: |
          set -euo pipefail
          command -v python
          test "$(command -v python)" = /usr/local/bin/python
          test "$(python --version 2>&1)" = "Python 3.14.6"
          python - <<'PY'
          import hashlib, tarfile, tempfile
          from pathlib import Path
          from urllib.request import urlopen
          with tempfile.TemporaryDirectory() as d:
              archive = Path(d) / "docker.tgz"
              with urlopen("https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz") as response:
                  archive.write_bytes(response.read())
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == "995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3"
              with tarfile.open(archive) as package:
                  member = package.extractfile(package.getmember("docker/docker"))
                  assert member
                  target = Path("/usr/local/bin/docker")
                  target.write_bytes(member.read())
                  target.chmod(0o755)
          PY
          install -d -m 755 /usr/libexec/docker/cli-plugins
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          target = Path("/usr/libexec/docker/cli-plugins/docker-buildx")
          with urlopen("https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64") as response:
              target.write_bytes(response.read())
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "dc8eaffbf29138123b4874d852522b12303c61246a5073fa0f025e4220317b1e"
          target.chmod(0o755)
          PY
          test "$(command -v docker)" = /usr/local/bin/docker
          docker version
          docker buildx version | grep -F 'v0.31.1'
      - name: Focused, one-to-one, ownership and workflow gates
        run: |
          set -euo pipefail
          uv run python -m compileall -q src/mayak/modules/entitlements_and_billing src/mayak/modules/beacon_management src/mayak/modules/scan_orchestration src/mayak/runtime/rf23_composition.py src/mayak/runtime/rf24_composition.py src/mayak/runtime/scheduler.py src/mayak/runtime/worker.py
          uv run pytest --collect-only -q tests/runtime/test_rf24_expired_access_integrity.py
          uv run pytest -q tests/runtime/test_rf24_expired_access_core.py tests/runtime/test_rf24_expired_access_integrity.py tests/runtime/test_rf24_expired_access_ownership.py tests/runtime/test_rf24_expired_access_boundaries.py
          uv run python scripts/runtime/check_rf24_expired_access_ownership.py .
          uv run python scripts/runtime/check_rf24_expired_access_workflow.py .github/workflows/ci-rf24-expired-access.yml
          uv run lint-imports
          uv run ruff check scripts/runtime/run_rf24_expired_access.py scripts/runtime/verify_rf24_expired_access.py scripts/runtime/check_rf24_expired_access_ownership.py scripts/runtime/check_rf24_expired_access_workflow.py scripts/runtime/check_rf24_expired_access_static_delta.py scripts/runtime/run_rf24_expired_access_static_delta.py tests/runtime/test_rf24_expired_access_integrity.py tests/runtime/test_rf24_expired_access_boundaries.py
          uv run mypy --explicit-package-bases scripts/runtime/run_rf24_expired_access.py scripts/runtime/verify_rf24_expired_access.py scripts/runtime/check_rf24_expired_access_static_delta.py scripts/runtime/run_rf24_expired_access_static_delta.py scripts/runtime/check_rf24_expired_access_workflow.py
      - name: Static base-vs-candidate delta
        run: uv run python scripts/runtime/run_rf24_expired_access_static_delta.py --base 6b1d7289a38e6195b7244199ae4ee1caf46eae45 --output rf24-expired-access-static-delta.json
      - name: Create NEW post-suite database and migrate from zero
        run: |
          set -euo pipefail
          db="mayak_rf24_expired_${GITHUB_RUN_ID}"
          case "$db" in (*[!a-zA-Z0-9_]*|'') exit 1;; esac
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db OWNER mayak_migration"
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA mayak AUTHORIZATION mayak_migration;'
          export MAYAK_DATABASE_NAME="$db"
          export RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:migration-only@postgres:5432/${db}"
          export RF24_DSN="postgresql+psycopg://mayak_application:application-only@postgres:5432/${db}"
          test "$MAYAK_DATABASE_NAME" = "$db"
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          db = os.environ["db"] if "db" in os.environ else os.environ["MAYAK_DATABASE_NAME"]
          assert os.environ["MAYAK_DATABASE_NAME"] == db
          for key in ("RF15_MIGRATION_DSN", "RF24_DSN"):
              target = urlsplit(os.environ[key]).path.lstrip("/")
              assert target == db, (key, "unexpected database target")
              assert target != "mayak"
          PY
          printf 'MAYAK_DATABASE_NAME=%s\n' "$MAYAK_DATABASE_NAME" >> "$GITHUB_ENV"
          printf 'RF15_MIGRATION_DSN=%s\n' "$RF15_MIGRATION_DSN" >> "$GITHUB_ENV"
          printf 'RF24_DSN=%s\n' "$RF24_DSN" >> "$GITHUB_ENV"
          uv run alembic upgrade head
          uv run python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          expected = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          assert len(expected) == 1, "migration contract requires one head"
          engine = create_engine(os.environ["RF15_MIGRATION_DSN"])
          with engine.connect() as connection:
              observed = [row[0] for row in connection.execute(text(
                  "SELECT version_num FROM mayak.alembic_version ORDER BY version_num"
              ))]
          assert observed == expected, "fresh database is not exactly at migration head"
          PY
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;'
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO mayak_application;'
      - name: FINAL post-suite P0-P8 on NEW database
        env:
          MAYAK_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF11_POSTGRES_DSN MAYAK_RF11_POSTGRES_PASSWORD_FILE MAYAK_RF11_POSTGRES_USER MAYAK_RF11_POSTGRES_HOST MAYAK_RF11_POSTGRES_PORT MAYAK_RF11_POSTGRES_DB
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit

          db = os.environ["MAYAK_DATABASE_NAME"]
          assert db.startswith("mayak_rf24_expired_") and db != "mayak"
          assert urlsplit(os.environ["RF24_DSN"]).path.lstrip("/") == db
          assert urlsplit(os.environ["RF15_MIGRATION_DSN"]).path.lstrip("/") == db
          import hashlib
          from mayak.runtime.settings import RuntimeConfigurationError, load_runtime_settings

          try:
              settings = load_runtime_settings()
          except RuntimeConfigurationError as exc:
              print(f"final-runtime-config-error={exc.reason_code}:{','.join(exc.fields)}")
              raise
          assert settings.runtime.profile.value == "synthetic_acceptance"
          assert settings.build.source_sha == os.environ["GITHUB_SHA"]
          assert settings.build.environment_id == f"avito-mayak-rf24-expired-{os.environ['GITHUB_RUN_ID']}"
          assert settings.build.lock_identity == hashlib.sha256(open("uv.lock", "rb").read()).hexdigest()
          assert settings.build.image_digest == "sha256:" + hashlib.sha256(open("Dockerfile", "rb").read()).hexdigest()
          assert settings.runtime.process_kind.value == "mayak-worker"
          assert settings.session.synthetic_identity_enabled is True
          assert settings.providers.avito_live_enabled is False
          assert settings.providers.telegram_enabled is False
          assert settings.providers.max_enabled is False
          assert settings.providers.yookassa_enabled is False
          assert settings.providers.egress_agent_enabled is False
          assert settings.api.host_port is None
          print("final-runtime-config-proof=PASS")
          PY
          rm -f rf24-expired-access-evidence.json rf24-expired-access-provider-observations.json rf24-expired-access-phase-boundaries.json rf24-expired-access-verifier-result.json rf24-expired-access-scanner-result.json rf24-expired-access.log
          uv run python scripts/runtime/run_rf24_expired_access.py --real-postgres --artifacts .
      - name: Verifier scanner manifest hash chain
        env:
          MAYAK_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s rf24-expired-access-evidence.json
          uv run python scripts/runtime/verify_rf24_expired_access.py rf24-expired-access-evidence.json "$GITHUB_SHA" --result rf24-expired-access-verifier-result.json
          uv run python scripts/runtime/check_rf24_expired_access_artifact_safety.py --result rf24-expired-access-scanner-result.json rf24-expired-access-evidence.json rf24-expired-access-provider-observations.json rf24-expired-access-phase-boundaries.json rf24-expired-access-adversarial-execution.json rf24-expired-access-static-delta.json rf24-expired-access-verifier-result.json rf24-expired-access.log
          test "$(python -c 'import json; print(json.load(open("rf24-expired-access-scanner-result.json"))["finding_count"])')" = 0
          uv run python scripts/runtime/build_rf24_expired_access_manifest.py . "$GITHUB_SHA" "$GITHUB_RUN_ID"
          test "$(python -c 'import json; print(json.load(open("rf24-expired-access-safety-manifest.json"))["scanner_finding_count"])')" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-expired-access
          if-no-files-found: error
          path: rf24-expired-access*
