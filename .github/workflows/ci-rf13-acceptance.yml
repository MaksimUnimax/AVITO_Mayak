name: RF-13 Hosted PostgreSQL Acceptance

on:
  push:
    branches: ["rf13-acceptance/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYSTEM_CONFIG: "1"
  UV_PROJECT_ENVIRONMENT: .venv
  RF13_TECHNICAL_ID: RF-13-BEACON-MANAGEMENT-RUNTIME-POSTGRES-20260802-01

jobs:
  rf13-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: rf13
          POSTGRES_USER: rf13
          POSTGRES_DB: rf13
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rf13 -d rf13"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with: {version: 0.11.31, python-version: 3.14.6, activate-environment: true}
      - name: Prove pinned uv identity
        run: test "$(uv --version | awk '{print $2}')" = "0.11.31"
      - run: uv sync --frozen --all-groups --python 3.14.6
      - run: uv run pytest -q tests/unit/test_rf13_beacon_runtime.py tests/runtime/test_beacon_schema.py tests/runtime/test_rf13_acceptance_integrity.py
      - run: uv run ruff check src/mayak/modules/beacon_management scripts/runtime/run_rf13_postgres_acceptance.py scripts/runtime/verify_rf13_acceptance.py scripts/runtime/run_rf13_tamper_matrix.py tests/runtime/test_rf13_acceptance_integrity.py
      - run: uv run mypy src/mayak/modules/beacon_management src/mayak/persistence/schema/beacon.py
      - run: uv run import-linter
      - name: Create isolated migration boundary
        env:
          PGPASSWORD: rf13
        run: |
          psql postgresql://rf13@127.0.0.1:5432/rf13 -v ON_ERROR_STOP=1 -c "CREATE ROLE mayak_migration LOGIN PASSWORD 'rf13migration'" -c "CREATE ROLE mayak_application LOGIN PASSWORD 'rf13application'" -c "CREATE SCHEMA mayak AUTHORIZATION mayak_migration"
      - run: |
          mkdir -p ci-evidence/rf13
          set +e
          uv run python scripts/runtime/run_rf13_postgres_acceptance.py \
            --dsn postgresql+psycopg://mayak_migration:rf13migration@127.0.0.1:5432/rf13 \
            --output ci-evidence/rf13/acceptance.json \
            --technical-id "$RF13_TECHNICAL_ID" \
            --candidate-sha "${{ github.sha }}" \
            >ci-evidence/rf13/producer.stdout \
            2>ci-evidence/rf13/producer.stderr
          producer_status=$?
          cat ci-evidence/rf13/producer.stdout
          cat ci-evidence/rf13/producer.stderr >&2
          if [ "$producer_status" -ne 0 ]; then
            last_line=$(tail -n 1 ci-evidence/rf13/producer.stderr)
            safe_last_line=$(printf '%s' "$last_line" | sed -E 's#(postgresql\+psycopg://[^:]+:)[^@]+@#\1***@#g')
            printf '::error file=scripts/runtime/run_rf13_postgres_acceptance.py::%s\n' "$safe_last_line"
            sql_line=$(grep -E 'sqlalchemy\.|psycopg\.|DETAIL:|ERROR:' ci-evidence/rf13/producer.stderr | head -n 1 || true)
            safe_sql_line=$(printf '%s' "$sql_line" | sed -E 's#(postgresql\+psycopg://[^:]+:)[^@]+@#\1***@#g')
            [ -z "$safe_sql_line" ] || printf '::error file=scripts/runtime/run_rf13_postgres_acceptance.py::%s\n' "$safe_sql_line"
            while IFS= read -r line; do
              safe_line=$(printf '%s' "$line" | sed -E 's#(postgresql\+psycopg://[^:]+:)[^@]+@#\1***@#g')
              printf '::error file=scripts/runtime/run_rf13_postgres_acceptance.py::%s\n' "$safe_line"
            done <ci-evidence/rf13/producer.stderr
            exit "$producer_status"
          fi
      - name: Independent fail-closed verifier
        run: |
          set +e
          uv run python scripts/runtime/verify_rf13_acceptance.py . ci-evidence/rf13/acceptance.json "${{ github.sha }}" \
            >ci-evidence/rf13/verifier.stdout \
            2>ci-evidence/rf13/verifier.stderr
          verifier_status=$?
          cat ci-evidence/rf13/verifier.stdout
          cat ci-evidence/rf13/verifier.stderr >&2
          if [ "$verifier_status" -ne 0 ]; then
            last_line=$(tail -n 1 ci-evidence/rf13/verifier.stderr)
            safe_last_line=$(printf '%s' "$last_line" | sed -E 's#(postgresql\+psycopg://[^:]+:)[^@]+@#\1***@#g')
            printf '::error file=scripts/runtime/verify_rf13_acceptance.py::%s\n' "$safe_last_line"
            exit "$verifier_status"
          fi
          test "$(cat ci-evidence/rf13/verifier.stdout)" = "RF13_ACCEPTANCE_VERIFIED"
          test "$(grep -o RF13_ACCEPTANCE_VERIFIED ci-evidence/rf13/verifier.stdout | wc -l)" = "1"
          test "$(grep -c RF13_ACCEPTANCE_VERIFIED ci-evidence/rf13/verifier.stderr || true)" = "0"
      - name: Tamper-negative matrix
        run: |
          uv run python scripts/runtime/run_rf13_tamper_matrix.py . \
            ci-evidence/rf13/acceptance.json "${{ github.sha }}" \
            ci-evidence/rf13/tamper-matrix.json
          test "$(python -c 'import json; print(json.load(open("ci-evidence/rf13/tamper-matrix.json"))["all_rejected"])')" = "True"
          test "$(python -c 'import json; print(json.load(open("ci-evidence/rf13/tamper-matrix.json"))["all_required_cases_present"])')" = "True"
          test "$(python -c 'import json; print(json.load(open("ci-evidence/rf13/tamper-matrix.json"))["uncovered_requirement_ids"])')" = "[]"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.1.0
        with:
          name: rf13-acceptance-${{ github.sha }}
          path: ci-evidence/rf13
