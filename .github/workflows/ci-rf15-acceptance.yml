name: RF15 PostgreSQL acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rf15:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: mayak
          POSTGRES_DB: mayak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MAYAK_DATABASE_HOST: 127.0.0.1
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      MAYAK_DATABASE_SSLMODE: disable
      RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf15migration@127.0.0.1:5432/mayak
      RF15_APPLICATION_DSN: postgresql+psycopg://mayak_application:rf15application@127.0.0.1:5432/mayak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14.6'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.11.31'}
      - run: uv sync --frozen
      - name: Create hosted database boundary
        run: |
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /run/secrets
          umask 077
          printf '%s' 'rf15migration' > /run/secrets/mayak_database_migration_password
          printf '%s' 'rf15application' > /run/secrets/mayak_database_application_password
          test "$(stat -c '%F:%a:%u:%g' /run/secrets)" = "directory:700:$(id -u):$(id -g)"
          test "$(stat -c '%F:%a' /run/secrets/mayak_database_migration_password)" = "regular file:600"
          test "$(stat -c '%F:%a' /run/secrets/mayak_database_application_password)" = "regular file:600"
          mapfile -t postgres_containers < <(docker ps --filter 'ancestor=postgres:18' --filter status=running --format '{{.ID}}')
          if [ "${#postgres_containers[@]}" -ne 1 ]; then
            echo "::error title=RF15 database boundary::expected exactly one running postgres:18 container, found ${#postgres_containers[@]}"
            exit 1
          fi
          postgres_container="${postgres_containers[0]}"
          image_ref=$(docker inspect --format '{{.Config.Image}}' "$postgres_container")
          test "$image_ref" = 'postgres:18'
          set +e
          boundary_output=$(docker exec "$postgres_container" psql -U mayak -d mayak -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN CREATE ROLE mayak_migration LOGIN PASSWORD 'rf15migration'; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$" \
            -c "DO \$\$ BEGIN CREATE ROLE mayak_application LOGIN PASSWORD 'rf15application'; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$" \
            -c "CREATE SCHEMA IF NOT EXISTS mayak AUTHORIZATION mayak_migration" 2>&1)
          boundary_status=$?
          set -e
          if [ "$boundary_status" -ne 0 ]; then
            boundary_message=$(printf '%s' "$boundary_output" | tr '\n' ' ' | sed -E 's/(password|PASSWORD)[^ ]*/\1=<redacted>/g')
            echo "::error title=RF15 database boundary::$boundary_message"
            exit "$boundary_status"
          fi
      - name: Alembic upgrade head
        env:
          RF15_DSN: ${{ env.RF15_MIGRATION_DSN }}
        run: uv run alembic upgrade head
      - name: Verify migration across a new connection
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["RF15_MIGRATION_DSN"])
          with engine.connect() as connection:
              assert not connection.in_transaction()
              version = connection.execute(text("select version_num from mayak.alembic_version")).scalar_one()
              tables = connection.execute(text("select count(*) from pg_catalog.pg_tables where schemaname='mayak' and tablename <> 'alembic_version'")).scalar_one()
              physical_indexes = [row[0] for row in connection.execute(text("select indexname from pg_catalog.pg_indexes where schemaname='mayak' order by indexname"))]
              scan_indexes = connection.execute(text("select count(*) from pg_catalog.pg_indexes where schemaname='mayak' and indexname like 'ix_scan_%'")).scalar_one()
              from mayak.persistence.metadata import metadata
              from alembic.config import Config
              from alembic.script import ScriptDirectory
              heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
              assert len(heads) == 1 and version == heads[0]
              assert tables == 51
              assert sum(len(table.indexes) for table in metadata.tables.values()) == 73
              assert len(physical_indexes) == 73
              assert scan_indexes == 8
          engine.dispose()
          PY
      - name: Grant application runtime privileges
        env:
          RF15_DSN: ${{ env.RF15_MIGRATION_DSN }}
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["RF15_DSN"])
          with engine.begin() as connection:
              connection.execute(text("GRANT USAGE ON SCHEMA mayak TO mayak_application"))
              connection.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application"))
              connection.execute(text("GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application"))
          engine.dispose()
          PY
      - run: uv run pytest -q tests/runtime/test_alembic_migration_serialization.py
      - run: uv run ruff check src/mayak/modules/scan_orchestration scripts/runtime
      - run: uv run mypy --follow-imports=skip --ignore-missing-imports src/mayak/modules/scan_orchestration
      - run: uv run pytest -q tests/runtime/test_scan_schema.py
      - run: uv run pytest -q tests/unit/test_rf15_scan_contracts.py
      - run: uv run pytest -q tests/runtime/test_rf15_verifier.py
      - run: uv run pytest -q tests/architecture/test_import_boundaries.py
      - run: |
          set -o pipefail
          set +e
          uv run python scripts/runtime/run_rf15_postgres_acceptance.py --dsn "$RF15_APPLICATION_DSN" --output rf15-evidence.json 2>&1 | tee rf15-producer.log
          producer_status=${PIPESTATUS[0]}
          if [ "$producer_status" -ne 0 ]; then
            producer_message=$(tr '\n' ' ' < rf15-producer.log)
            echo "::error title=RF15 producer diagnostic::$producer_message"
            exit "$producer_status"
          fi
          set -e
      - run: |
          set +e
          uv run python scripts/runtime/verify_rf15_acceptance.py rf15-evidence.json > verifier.stdout 2> verifier.stderr
          verifier_status=$?
          cat verifier.stdout
          cat verifier.stderr >&2
          if [ "$verifier_status" -ne 0 ]; then
            verifier_message=$(tr '\n' ' ' < verifier.stderr)
            echo "::error title=RF15 strict verifier::$verifier_message"
            exit "$verifier_status"
          fi
          test "$(grep -c '^RF15_ACCEPTANCE_VERIFIED$' verifier.stdout)" -eq 1
          test "$(grep -c '^RF15_ACCEPTANCE_VERIFIED$' verifier.stderr || true)" -eq 0
      - name: Independent immutable RF15 matrix meta-gate
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          ids = json.loads(Path('rf15-evidence.json').read_text())['scenario_ids']
          requirements = json.loads(Path('rf15-requirement-map.json').read_text())['requirements']
          tampers = json.loads(Path('rf15-tamper-matrix.json').read_text())['tampers']
          print('RF15_COUNTS', len(ids), len(requirements), len(tampers))
          print('RF15_ID_SET', sorted(set(ids)))
          print('RF15_REQUIREMENT_SET', sorted({row['requirement_id'] for row in requirements}))
          print('RF15_TAMPER_SET', sorted({row['requirement_id'] for row in tampers}))
          failures = []
          if not len(ids) == len(set(ids)) == 29:
              failures.append(f'ids={len(ids)} unique={len(set(ids))}')
          if not len(requirements) == len(tampers) == 29:
              failures.append(f'rows={len(requirements)} tampers={len(tampers)}')
          if {row['requirement_id'] for row in requirements} != set(ids):
              failures.append('requirement set mismatch')
          if {row['requirement_id'] for row in tampers} != set(ids):
              failures.append('tamper set mismatch')
          for row in requirements + tampers:
              rid = row['requirement_id']
              vector = (row['checker_before'].get(rid), row['checker_after'].get(rid), rid in row['changed_checker_ids'])
              if vector != (True, False, True):
                  failures.append(f'{rid}={vector}')
          if failures:
              print('::error title=RF15 matrix meta-gate::' + '; '.join(failures))
              raise SystemExit(1)
          print('RF15_MATRIX_META_GATE_VERIFIED')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf15-postgres-acceptance
          path: |
            rf15-evidence.json
            rf15-requirement-map.json
            rf15-tamper-matrix.json
            rf15-verifier-diagnostics.json
            verifier.stdout
            verifier.stderr
            rf15-producer.log
