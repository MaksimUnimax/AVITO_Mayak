name: RF24 backup and restore

on:
  push:
    branches: [main, rf24-backup-restore-scenario-01]
  workflow_dispatch:

jobs:
  backup-restore:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: mayak
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_VERSION: 0.11.31
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
      PGPASSWORD: bootstrap-only
    steps:
      - name: Install git and Docker client
        run: apt-get update && apt-get install -y --no-install-recommends git docker.io
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Frozen dependency sync
        run: uv sync --frozen --all-groups
      - name: Bootstrap roles and accepted initial database
        env:
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
        run: |
          set -euo pipefail
          psql -h postgres -U mayak -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE mayak_migration LOGIN PASSWORD 'migration-only' CREATEDB; CREATE ROLE mayak_application LOGIN PASSWORD 'application-only';" || true
          psql -h postgres -U mayak -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE mayak OWNER mayak_migration;" || true
          uv run alembic upgrade head
          psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;"
      - name: Complete repository pytest once
        run: uv run pytest -q 2>&1 | tee rf24-complete-repository-pytest.log
      - name: Create fresh task-owned source and restore databases
        env:
          RF24_ADMIN_PASSWORD: bootstrap-only
        run: |
          set -euo pipefail
          source_db="mayak_rf24_backup_source_${GITHUB_RUN_ID}"
          target_db="mayak_rf24_backup_restore_${GITHUB_RUN_ID}"
          printf 'SOURCE_DB=%s\nTARGET_DB=%s\n' "$source_db" "$target_db" >> "$GITHUB_ENV"
          psql -h postgres -U mayak -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $source_db OWNER mayak_migration; CREATE DATABASE $target_db OWNER mayak_migration;"
          printf 'postgresql+psycopg://mayak_migration:migration-only@postgres:5432/%s\n' "$source_db" > /tmp/rf24-source-dsn
          printf 'postgresql+psycopg://mayak_migration:migration-only@postgres:5432/%s\n' "$target_db" > /tmp/rf24-target-dsn
      - name: Migrate both databases from zero
        env:
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
        run: |
          set -euo pipefail
          RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:migration-only@postgres:5432/${SOURCE_DB}" uv run alembic upgrade head
          # Target B remains empty/known until the verified archive is restored.
      - name: RF24 logical backup, verification, restore and cleanup
        env:
          RF24_PG_PASSWORD: migration-only
          RF24_PG_TOOL_PREFIX: docker exec postgres
        run: |
          set -euo pipefail
          docker exec postgres pg_dump --version
          docker exec postgres pg_restore --version
          source_dsn="postgresql://mayak_migration@127.0.0.1:5432/${SOURCE_DB}"
          target_dsn="postgresql://mayak_migration@127.0.0.1:5432/${TARGET_DB}"
          uv run python scripts/runtime/run_rf24_backup_restore.py --source-dsn "$source_dsn" --target-dsn "$target_dsn" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output rf24-backup-restore-evidence.json --backup /tmp/rf24-backup-restore.dump
      - name: Independent verifier, scanner and manifest
        run: |
          set -euo pipefail
          psql -h postgres -U mayak -d "$TARGET_DB" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;"
          uv run python scripts/runtime/verify_rf24_backup_restore.py --evidence rf24-backup-restore-evidence.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --result rf24-backup-restore-verifier-result.json
          uv run python scripts/runtime/check_rf24_backup_restore_artifact_safety.py --result rf24-backup-restore-scanner-result.json rf24-backup-restore-evidence.json rf24-backup-restore-verifier-result.json rf24-complete-repository-pytest.log
          uv run python scripts/runtime/build_rf24_backup_restore_manifest.py --output rf24-backup-restore-safety-manifest.json --scanner rf24-backup-restore-scanner-result.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" rf24-backup-restore-evidence.json rf24-backup-restore-verifier-result.json rf24-backup-restore-scanner-result.json rf24-complete-repository-pytest.log
          uv run python scripts/runtime/check_rf24_backup_restore_workflow.py .github/workflows/ci-rf24-backup-restore.yml
          uv run python scripts/runtime/check_rf24_backup_restore_ownership.py scripts/runtime/run_rf24_backup_restore.py scripts/runtime/verify_rf24_backup_restore.py
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-backup-restore
          if-no-files-found: error
          path: |
            rf24-backup-restore-evidence.json
            rf24-backup-restore-verifier-result.json
            rf24-backup-restore-scanner-result.json
            rf24-backup-restore-safety-manifest.json
            rf24-complete-repository-pytest.log
      # RF25 is deliberately not started by this workflow.
