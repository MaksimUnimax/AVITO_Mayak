name: RF24 backup and restore

on:
  push:
    branches: [rf24-backup-restore-scenario-01]
  workflow_dispatch:

jobs:
  backup-restore:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm
    services:
      mayak-postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: mayak
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_VERSION: 0.11.31
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
      PGPASSWORD: bootstrap-only
      RF24_PG_DATABASE_ROLE: mayak_migration
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and Docker client
        run: apt-get update && apt-get install -y --no-install-recommends git docker.io
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Frozen dependency sync
        run: uv sync --frozen --all-groups
      - name: Bootstrap roles and accepted initial database
        env:
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@mayak-postgres:5432/mayak
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          import psycopg
          from psycopg import sql
          def role(cur, name, password, createdb=False):
              cur.execute("SELECT 1 FROM pg_roles WHERE rolname=%s", (name,))
              if cur.fetchone() is None:
                  suffix = sql.SQL(" CREATEDB") if createdb else sql.SQL("")
                  cur.execute(sql.SQL("CREATE ROLE {} LOGIN PASSWORD {}{}").format(sql.Identifier(name), sql.Literal(password), suffix))
          with psycopg.connect("host=mayak-postgres dbname=postgres user=mayak password=bootstrap-only", autocommit=True) as c:
              with c.cursor() as cur:
                  role(cur, "mayak_migration", "migration-only", True)
                  role(cur, "mayak_application", "application-only")
                  cur.execute("ALTER DATABASE mayak OWNER TO mayak_migration")
          # The canonical bootstrap database is distinct from TARGET B; its
          # migration schema is required by the repository's Alembic runner.
          with psycopg.connect("host=mayak-postgres dbname=mayak user=mayak_migration password=migration-only", autocommit=True) as c:
              with c.cursor() as cur:
                  cur.execute("CREATE SCHEMA IF NOT EXISTS mayak AUTHORIZATION mayak_migration")
          PY
          uv run alembic upgrade head
      - name: Create fresh task-owned source and restore databases
        env:
          RF24_ADMIN_PASSWORD: bootstrap-only
        run: |
          set -euo pipefail
          source_db="mayak_rf24_backup_source_${GITHUB_RUN_ID}"
          target_db="mayak_rf24_backup_restore_${GITHUB_RUN_ID}"
          conflict_db="mayak_rf24_backup_conflict_${GITHUB_RUN_ID}"
          printf 'SOURCE_DB=%s\nTARGET_DB=%s\nCONFLICT_DB=%s\n' "$source_db" "$target_db" "$conflict_db" >> "$GITHUB_ENV"
          uv run python - "$source_db" "$target_db" "$conflict_db" <<'PY'
          import sys
          import psycopg
          from psycopg import sql
          names = sys.argv[1:]
          with psycopg.connect("host=mayak-postgres dbname=postgres user=mayak password=bootstrap-only", autocommit=True) as c:
              with c.cursor() as cur:
                  for name in names:
                      if not name.isidentifier(): raise SystemExit("unsafe database name")
                      cur.execute("SELECT 1 FROM pg_database WHERE datname=%s", (name,))
                      if cur.fetchone() is not None: raise SystemExit("task database already exists")
                      cur.execute(sql.SQL("CREATE DATABASE {} OWNER mayak_migration").format(sql.Identifier(name)))
          PY
      - name: Migrate both databases from zero
        env:
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@mayak-postgres:5432/mayak
        run: |
          set -euo pipefail
          uv run python - "$SOURCE_DB" "$CONFLICT_DB" <<'PY'
          import sys
          import psycopg
          for database in sys.argv[1:]:
              with psycopg.connect(f"host=mayak-postgres dbname={database} user=mayak_migration password=migration-only", autocommit=True) as conn:
                  with conn.cursor() as cur:
                      cur.execute("CREATE SCHEMA mayak AUTHORIZATION mayak_migration")
          PY
          RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:migration-only@mayak-postgres:5432/${SOURCE_DB}" uv run alembic upgrade head
          # Target B remains empty/known until the verified archive is restored.
          RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:migration-only@mayak-postgres:5432/${CONFLICT_DB}" uv run alembic upgrade head
      - name: Establish SOURCE application grants and prove empty TARGET
        run: |
          set -euo pipefail
          uv run python - "$SOURCE_DB" "$TARGET_DB" "$CONFLICT_DB" <<'PY'
          import sys
          import psycopg
          from psycopg import sql
          source, target, conflict = sys.argv[1:]
          for database in (source, target, conflict):
              with psycopg.connect(f"host=mayak-postgres dbname={database} user=mayak_migration password=migration-only", autocommit=True) as conn:
                  with conn.cursor() as cur:
                      cur.execute(sql.SQL("GRANT CONNECT ON DATABASE {} TO mayak_application").format(sql.Identifier(database)))
                      if database != target:
                          cur.execute("GRANT USAGE ON SCHEMA mayak TO mayak_application")
                          cur.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application")
                          cur.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application")
          with psycopg.connect(f"host=mayak-postgres dbname={source} user=mayak_application password=application-only") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT has_schema_privilege(current_user, 'mayak', 'USAGE'), count(*) FROM mayak.alembic_version")
                  usage, count = cur.fetchone()
                  assert usage is True and count > 0
          with psycopg.connect(f"host=mayak-postgres dbname={target} user=mayak_migration password=migration-only") as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name='mayak')")
                  assert cur.fetchone()[0] is False
                  cur.execute("SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='mayak' AND c.relkind IN ('r','p','v','m','S','f')")
                  assert cur.fetchone()[0] == 0
                  cur.execute("SELECT to_regclass('mayak.alembic_version')")
                  assert cur.fetchone()[0] is None
          PY
      - name: Seed SOURCE through accepted runtime boundaries
        env:
          MAYAK_RUNTIME_PROFILE: synthetic_acceptance
          MAYAK_DATABASE_HOST: mayak-postgres
          MAYAK_DATABASE_APPLICATION_USER: mayak_application
          MAYAK_SECRETS_DIR: /tmp/rf24-secrets
          MAYAK_API_INTERNAL_PORT: "18080"
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/rf24-secrets
          printf '%s' application-only > /tmp/rf24-secrets/mayak_database_application_password
          chmod 600 /tmp/rf24-secrets/mayak_database_application_password
          export MAYAK_DATABASE_NAME="$SOURCE_DB"
          uv run python -m scripts.runtime.run_rf24_vertical_spine --repo-root "$GITHUB_WORKSPACE" --output rf24-source-runtime-seed.json --probes rf24-source-runtime-probes.json --log rf24-source-runtime.log --source-sha "$GITHUB_SHA"
      - name: Bind exact PostgreSQL 18 service tooling boundary
        run: |
          set -euo pipefail
          mapfile -t candidates < <(docker ps --filter ancestor=postgres:18-bookworm --format '{{.ID}}')
          test "${#candidates[@]}" -eq 1
          container="${candidates[0]}"
          image="$(docker inspect --format '{{.Config.Image}}' "$container")"
          test "$image" = postgres:18-bookworm
          docker exec -i -u postgres "$container" sh -c 'umask 077; cat > /tmp/rf24.pgpass' <<'PGPASS'
          *:*:*:mayak_migration:migration-only
          PGPASS
          docker exec "$container" pg_dump --version
          docker exec "$container" pg_restore --version
          printf 'RF24_PG_TOOL_PREFIX=docker exec -i -u postgres -e PGPASSFILE=/tmp/rf24.pgpass %s\n' "$container" >> "$GITHUB_ENV"
          printf 'RF24_PG_TOOL_SOURCE_DSN=%s\n' "$SOURCE_DB" >> "$GITHUB_ENV"
          printf 'RF24_PG_TOOL_TARGET_DSN=%s\n' "$TARGET_DB" >> "$GITHUB_ENV"

      - name: RF24 logical backup, verification, restore and cleanup
        env:
          RF24_APPLICATION_PASSWORD: application-only
          PGPASSWORD: migration-only
        run: |
          set -euo pipefail
          export RF24_SOURCE_DSN="postgresql://mayak_migration:migration-only@mayak-postgres:5432/${SOURCE_DB}"
          export RF24_TARGET_DSN="postgresql://mayak_migration:migration-only@mayak-postgres:5432/${TARGET_DB}"
          export RF24_CONFLICT_DSN="postgresql://mayak_migration:migration-only@mayak-postgres:5432/${CONFLICT_DB}"
          uv run python -m scripts.runtime.run_rf24_backup_restore --source-dsn-env RF24_SOURCE_DSN --target-dsn-env RF24_TARGET_DSN --conflict-dsn-env RF24_CONFLICT_DSN --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output rf24-backup-restore-evidence.json --backup /tmp/rf24-backup-restore.dump --seed-evidence rf24-source-runtime-seed.json
      - name: Scenario-specific PG18 gate passed before broad suite
        run: test -s rf24-backup-restore-evidence.json
      - name: Install pinned Docker CLI and Buildx for H26
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          curl -fsSLo docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz
          echo '995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3  docker.tgz' | sha256sum -c -
          tar -xzf docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          curl -fsSLo buildx https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64
          echo 'dc8eaffbf29138123b4874d852522b12303c61246a5073fa0f025e4220317b1e  buildx' | sha256sum -c -
          install -Dm755 buildx /usr/libexec/docker/cli-plugins/docker-buildx
          docker version
          docker buildx version | grep -F 'v0.31.1'
          docker buildx ls
      - name: H26 executable preflight and focused prerequisite probes
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          test -n "${GITHUB_WORKSPACE:-}"
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$workspace"
          test "$(git rev-parse --show-toplevel)" = "$workspace"
          git rev-parse HEAD >/dev/null
          git merge-base --is-ancestor 90a00b12561cecbeac04e3b41c403bcee78f3d71 "$GITHUB_SHA"
          git rev-parse HEAD:.github/workflows/ci-rf24-backup-restore.yml >/dev/null
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_NOSYSTEM=%s\n' "$GIT_CONFIG_NOSYSTEM" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_COUNT=%s\nGIT_CONFIG_KEY_0=%s\nGIT_CONFIG_VALUE_0=%s\n' 1 safe.directory "$workspace" >> "$GITHUB_ENV"
          test "$(docker version --format '{{.Client.Version}}')" = '29.2.1'
          test "$(docker version --format '{{.Server.Version}}')" = '29.2.1'
          docker buildx version | grep -F 'v0.31.1'
          docker buildx ls | grep -E '(^|[[:space:]])(default|rf24-h26)' >/dev/null
          test -d /opt/avito-mayak-runtime
          test ! -e /tmp/rf24-h26/migration.pgpass
          # The focused probes and the complete suite share this one task-owned
          # migrated database; the restore TARGET is never used here.
          uv run python - <<'PY'
          import psycopg
          from psycopg import sql
          with psycopg.connect("host=mayak-postgres dbname=mayak user=mayak_migration password=migration-only", autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("GRANT USAGE ON SCHEMA mayak TO mayak_application")
                  cur.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application")
                  cur.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application")
                  cur.execute("SELECT version_num FROM mayak.alembic_version")
                  assert cur.fetchone()
          PY
          echo h26-substrate-preflight=PASS
      - name: Complete repository pytest once
        run: |
          set -euo pipefail
          h26_root="/tmp/rf24-h26"
          install -d -m 700 "$h26_root"
          password_file="$h26_root/migration.pgpass"
          cleanup() { rm -f -- "$password_file"; rmdir "$h26_root" 2>/dev/null || true; }
          trap cleanup EXIT
          umask 077
          printf '%s\n' 'mayak-postgres:5432:mayak:mayak_migration:migration-only' > "$password_file"
          chmod 600 "$password_file"
          test "$(stat -c '%a' "$password_file")" = 600
          export PGPASSFILE="$password_file"
          export MAYAK_RF10_POSTGRES_DSN='postgresql+psycopg://mayak_application:application-only@mayak-postgres:5432/mayak'
          export MAYAK_RF11_POSTGRES_PASSWORD_FILE="$password_file"
          export MAYAK_RF11_POSTGRES_USER=mayak_migration
          export MAYAK_RF11_POSTGRES_HOST=mayak-postgres
          export MAYAK_RF11_POSTGRES_PORT=5432
          export MAYAK_RF11_POSTGRES_DB=mayak
          uv run pytest -q tests/runtime/test_persistence_transaction.py tests/runtime/test_platform_audit_repository.py tests/runtime/test_platform_idempotency_repository_postgres.py
          uv run pytest -q tests/runtime/test_identity_runtime_postgres.py
          uv run pytest -q tests/runtime/test_rf08_safe_compose_bootstrap.py::test_build_input_digest_follows_copy_inputs_and_includes_readme
          uv run pytest -q 2>&1 | tee rf24-complete-repository-pytest.log
      - name: Independent verifier, scanner and manifest
        run: |
          set -euo pipefail
          uv run python -m scripts.runtime.verify_rf24_backup_restore --evidence rf24-backup-restore-evidence.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --result rf24-backup-restore-verifier-result.json
          uv run python -m scripts.runtime.check_rf24_backup_restore_artifact_safety --result rf24-backup-restore-scanner-result.json rf24-backup-restore-evidence.json rf24-backup-restore-verifier-result.json rf24-complete-repository-pytest.log
          uv run python -m scripts.runtime.build_rf24_backup_restore_manifest --output rf24-backup-restore-safety-manifest.json --scanner rf24-backup-restore-scanner-result.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" rf24-backup-restore-evidence.json rf24-backup-restore-verifier-result.json rf24-backup-restore-scanner-result.json rf24-complete-repository-pytest.log
          uv run python -m scripts.runtime.check_rf24_backup_restore_workflow .github/workflows/ci-rf24-backup-restore.yml
          uv run python -m scripts.runtime.check_rf24_backup_restore_ownership scripts/runtime/run_rf24_backup_restore.py scripts/runtime/verify_rf24_backup_restore.py
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-backup-restore
          if-no-files-found: error
          path: |
            rf24-backup-restore-evidence.json
            rf24-backup-restore-verifier-result.json
            rf24-backup-restore-scanner-result.json
            rf24-backup-restore-safety-manifest.json
            rf24-complete-repository-pytest.log
      # RF25 is deliberately not started by this workflow.
