name: RF17 Notification Delivery durable runtime acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rf17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: mayak, POSTGRES_PASSWORD: mayak, POSTGRES_DB: mayak}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RF17_APPLICATION_DSN: postgresql+psycopg://mayak_application:rf17application@127.0.0.1:5432/mayak
      RF17_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf17migration@127.0.0.1:5432/mayak
      # build_migration_url intentionally consumes this shared compatibility alias.
      RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf17migration@127.0.0.1:5432/mayak
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14.6'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.11.31'}
      - run: test "$(python --version)" = "Python 3.14.6"
      - run: test "$(uv --version | awk '{print $2}')" = "0.11.31"
      - run: uv sync --frozen --all-groups --python 3.14.6
      - name: Create canonical database boundary
        run: |
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /run/secrets
          umask 077
          printf '%s' 'mayak' > /run/secrets/mayak_postgres_bootstrap_password
          printf '%s' 'rf17migration' > /run/secrets/mayak_database_migration_password
          printf '%s' 'rf17application' > /run/secrets/mayak_database_application_password
          uv run python - <<'PY'
          from mayak.persistence.bootstrap import bootstrap_database
          from mayak.persistence.config import BootstrapDatabaseSettings, DatabaseEndpoint
          bootstrap_database(settings=BootstrapDatabaseSettings(endpoint=DatabaseEndpoint(host='127.0.0.1')))
          PY
      - name: Check migration URL host before Alembic
        run: |
          uv run python - <<'PY'
          from mayak.persistence.config import build_migration_url
          url = build_migration_url(require_secret=False)
          assert url.host == '127.0.0.1'
          assert url.username == 'mayak_migration'
          print(f'migration_host={url.host} migration_user={url.username}')
          PY
      - run: uv run alembic upgrade head
      - name: Grant only acceptance runtime access
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine('${{ env.RF17_MIGRATION_DSN }}')
          with engine.begin() as c:
              c.execute(text("""
              do $$ declare r record; begin
                for r in select table_schema, table_name from information_schema.tables
                  where table_schema='mayak' and table_name not like 'notification_%' and table_name <> 'alembic_version'
                loop execute format('revoke insert, update, delete on table %I.%I from mayak_application', r.table_schema, r.table_name); end loop;
              end $$;
              """))
              c.execute(text('grant select, insert, update, delete on table mayak.notification_endpoints, mayak.notification_events, mayak.notification_outbox, mayak.notification_delivery_attempts, mayak.notification_delivery_reconciliations to mayak_application'))
          PY
      - run: uv run pytest -q tests/unit/test_notification_delivery_source_intake_semantics.py tests/unit/test_notification_delivery_attempt_semantics.py tests/unit/test_notification_delivery_outbox_semantics.py tests/contract/test_notification_delivery_source_intake_contracts.py tests/contract/test_notification_delivery_attempt_contracts.py tests/runtime/test_rf17_notification_delivery_runtime.py tests/runtime/test_rf17_verifier.py tests/architecture/test_rf17_notification_runtime_boundaries.py tests/architecture/test_import_boundaries.py
      - run: uv run ruff check src/mayak/modules/notification_delivery/runtime.py scripts/runtime/run_rf17_postgres_acceptance.py scripts/runtime/verify_rf17_acceptance.py
      - run: uv run mypy --follow-imports=skip --ignore-missing-imports src/mayak/modules/notification_delivery/runtime.py
      - name: Produce raw observations
        run: uv run python scripts/runtime/run_rf17_postgres_acceptance.py --dsn "$RF17_APPLICATION_DSN" --fixture-dsn "$RF17_MIGRATION_DSN" --output rf17-evidence.json > rf17-producer.stdout 2> rf17-producer.stderr
      - name: Check producer and artifact safety
        run: |
          test ! -s rf17-producer.stderr
          uv run python - <<'PY'
          import ast
          import json, re
          from pathlib import Path
          producer = Path('scripts/runtime/run_rf17_postgres_acceptance.py').read_text()
          forbidden = ('verify_rf17_acceptance', 'importlib', 'SimpleNamespace', 'EXPECTED_RF17', 'observations', 'passes', 'verdicts', 'acceptance_results')
          assert not any(item in producer for item in forbidden)
          ast.parse(producer)
          value = Path('rf17-evidence.json').read_text()
          assert not re.search(r'(?i)(bearer\s+\S+|authorization\s*[:=]|cookie\s*[:=])', value)
          data = json.loads(value)
          assert 'observations' not in data
          assert 'claim_observations' not in data
          PY
      - name: Strict independent verifier
        run: |
          set +e
          uv run python scripts/runtime/verify_rf17_acceptance.py rf17-evidence.json --expected-sha "$GITHUB_SHA" --diagnostics rf17-verifier-diagnostics.json > rf17-verifier.stdout 2> rf17-verifier.stderr
          status=$?
          set -e
          test "$status" -eq 0
          test "$(grep -c '^RF17_NOTIFICATION_DELIVERY_RUNTIME_VERIFIED$' rf17-verifier.stdout)" -eq 1
          test "$(grep -c 'RF17_NOTIFICATION_DELIVERY_RUNTIME_VERIFIED' rf17-verifier.stderr || true)" -eq 0
      - name: Immutable meta-gate
        run: |
          uv run python - <<'PY'
          import copy
          import json
          from pathlib import Path
          d = json.loads(Path('rf17-verifier-diagnostics.json').read_text())
          from scripts.runtime import verify_rf17_acceptance as verifier
          EXPECTED_RF17_REQUIREMENT_IDS = verifier.EXPECTED_RF17_REQUIREMENT_IDS
          EXPECTED_RF17_TAMPER_STRATEGY_IDS = verifier.EXPECTED_RF17_TAMPER_STRATEGY_IDS
          registry = verifier.registry()
          assert tuple(d['requirement_ids']) == EXPECTED_RF17_REQUIREMENT_IDS
          assert tuple(d['tamper_strategy_ids']) == EXPECTED_RF17_TAMPER_STRATEGY_IDS
          assert d['requirement_count'] == d['checker_count'] == d['unique_checker_count'] == 48
          assert d['tamper_count'] == d['unique_tamper_count'] == 48
          assert d['original_pass_count'] == d['tamper_rejected_count'] == 48
          assert d['original_failures'] == [] and d['tamper_failures'] == []
          assert d['counterexample_count'] >= 48
          assert d['counterexample_rejected_count'] == d['counterexample_count']
          assert tuple(d['counterexample_covered_requirements']) == EXPECTED_RF17_REQUIREMENT_IDS
          assert d['executed_case_count'] == 48
          assert d['requirement_executed_case_binding_count'] == 48
          assert d['fabricated_case_count'] == 0
          assert len(d['requirement_checker_mapping']) == len(d['requirement_scenario_mapping']) == len(d['required_raw_paths']) == 48
          evidence = json.loads(Path('rf17-evidence.json').read_text())
          assert len(evidence['executed_case_ledger']) == 48
          assert len(evidence['requirement_case_bindings']) == 48
          assert all(case.get('recorder') in {'single_call', 'concurrent_call', 'stage_sequence'} for case in evidence['executed_case_ledger'].values())
          verifier.assert_no_acceptance_summary(evidence)
          bad_e446 = {'technical_id': verifier.TECHNICAL_ID, 'identity': {'candidate_sha': 'a' * 40}, 'source_cases': {'single_committed_event': True, 'replay_same_row': True, 'trusted_delivered_binds_attempt': True}}
          try:
              verifier.assert_no_acceptance_summary(bad_e446)
          except AssertionError:
              pass
          else:
              raise AssertionError('e446 summary fixture was accepted')
          assert 'observations' not in evidence
          assert all(item.required_raw_paths for item in registry)
          assert len({item.check.__name__ for item in registry}) == 48
          assert len({item.tamper.__name__ for item in registry}) == 48
          verifier_source = Path('scripts/runtime/verify_rf17_acceptance.py').read_text()
          for forbidden in ('registry_group', '_spec_for', 'operation.relation_id', 'physical.relation_id'):
              assert forbidden not in verifier_source
          assert 'def _recon(' not in verifier_source and 'def _restart(' not in verifier_source and 'def _history(' not in verifier_source
          assert 'runtime_results' in verifier_source and 'lease_fingerprint' in verifier_source and 'physical_before' in verifier_source
          false_positive = copy.deepcopy(evidence['fanout']['concurrent_dedup'])
          false_positive['physical_before'] = [{'id': 'preexisting-row'}]
          false_positive['physical_after'] = [{'id': 'preexisting-row', 'event_id': false_positive['input']['event_id'], 'endpoint_id': false_positive['input']['endpoint_id']}]
          false_positive['runtime_results'] = [{'backend_pid': 101, 'kind': 'return', 'outbox_ids': []}, {'backend_pid': 102, 'kind': 'return', 'outbox_ids': []}]
          assert not verifier.check_fanout_concurrent({'fanout': {'concurrent_dedup': false_positive}})
          for item in registry:
              mutated = copy.deepcopy(evidence)
              before = json.dumps(mutated, sort_keys=True)
              item.tamper(mutated)
              assert json.dumps(mutated, sort_keys=True) != before
              assert not item.check(mutated)
          assert Path('rf17-verifier.stderr').read_text().count('RF17_NOTIFICATION_DELIVERY_RUNTIME_VERIFIED') == 0
          Path('rf17-meta-gate.json').write_text(json.dumps({'requirement_count': d['requirement_count'], 'original_pass_count': d['original_pass_count'], 'tamper_rejected_count': d['tamper_rejected_count'], 'counterexample_count': d['counterexample_count'], 'counterexample_rejected_count': d['counterexample_rejected_count'], 'raw_path_mapping_count': d['raw_path_mapping_count'], 'ids_equal': True}, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf17-notification-delivery-acceptance
          path: |
            rf17-evidence.json
            rf17-producer.stdout
            rf17-producer.stderr
            rf17-verifier.stdout
            rf17-verifier.stderr
            rf17-verifier-diagnostics.json
            rf17-meta-gate.json
