name: RF24 command idempotency

on:
  push:
    branches: [main, rf24-command-idempotency-scenarios-01]
  workflow_dispatch:

jobs:
  command-idempotency:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container: python:3.14.6-bookworm
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env: {POSTGRES_DB: mayak, POSTGRES_USER: mayak, POSTGRES_PASSWORD: bootstrap-only}
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      UV_VERSION: 0.11.31
      MAYAK_DATABASE_HOST: postgres
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      MAYAK_RF10_POSTGRES_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      MAYAK_RUNTIME_PROFILE: synthetic_acceptance
      MAYAK_API_INTERNAL_PORT: "18080"
      MAYAK_API_BIND_HOST: 127.0.0.1
      MAYAK_API_HOST_PORT: disabled
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
    steps:
      - name: Install git and postgres client
        run: apt-get update && apt-get install -y --no-install-recommends git postgresql-client
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: ${{ github.sha }}}
      - name: Source identity and workspace trust
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          ! git config --get-all safe.directory | grep -Fxq '*'
      - uses: astral-sh/setup-uv@v6
        with: {version: ${{ env.UV_VERSION }}, enable-cache: true}
      - name: Frozen dependency sync
        run: uv sync --frozen --all-groups
      - name: PostgreSQL 18 bootstrap and migrations
        env: {PGPASSWORD: bootstrap-only, RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak}
        run: |
          set -euo pipefail
          psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE ROLE mayak_migration LOGIN PASSWORD 'migration-only'; CREATE ROLE mayak_application LOGIN PASSWORD 'application-only'; ALTER ROLE mayak_migration CREATEDB; CREATE SCHEMA mayak AUTHORIZATION mayak_migration; GRANT USAGE, CREATE ON SCHEMA mayak TO mayak_application;"
          install -d -m 700 /run/secrets
          printf '%s' migration-only > /run/secrets/mayak_database_migration_password
          printf '%s' application-only > /run/secrets/mayak_database_application_password
          printf '%s' rf24-command-idempotency-session-key > /run/secrets/mayak_session_signing_key
          chmod 600 /run/secrets/mayak_database_*_password
          chmod 600 /run/secrets/mayak_session_signing_key
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -c "GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;"
      - name: Focused and relevant tests
        run: |
          uv run pytest -q tests/runtime/test_rf24_command_idempotency.py tests/runtime/test_rf24_command_idempotency_integrity.py tests/runtime/test_platform_idempotency_repository_postgres.py tests/runtime/test_rf23_api_contract.py
          uv run ruff check scripts/runtime/run_rf24_command_idempotency.py scripts/runtime/verify_rf24_command_idempotency.py scripts/runtime/check_rf24_command_idempotency_artifact_safety.py scripts/runtime/build_rf24_command_idempotency_manifest.py tests/runtime/test_rf24_command_idempotency.py tests/runtime/test_rf24_command_idempotency_integrity.py
          uv run mypy --explicit-package-bases scripts/runtime/run_rf24_command_idempotency.py scripts/runtime/verify_rf24_command_idempotency.py
          uv run lint-imports
      - name: Complete repository pytest
        run: uv run pytest -q
      - name: Real public command scenarios and independent acceptance
        run: |
          set -euo pipefail
          export MAYAK_ENVIRONMENT_ID=rf24-command-hosted-01 MAYAK_SOURCE_SHA="$GITHUB_SHA" MAYAK_LOCK_IDENTITY=$(printf '%064d' 0) MAYAK_IMAGE_DIGEST=sha256:$(printf '%064d' 0) MAYAK_DATABASE_APPLICATION_USER=mayak_application MAYAK_DATABASE_MIGRATION_USER=mayak_migration MAYAK_SECRETS_DIR=/run/secrets
          uv run python scripts/runtime/run_rf24_command_idempotency.py --repo-root "$GITHUB_WORKSPACE" --output rf24-command-idempotency-evidence.json --probes rf24-command-idempotency-process-probes.json --log rf24-command-idempotency.log --source-sha "$GITHUB_SHA"
          uv run python scripts/runtime/verify_rf24_command_idempotency.py --evidence rf24-command-idempotency-evidence.json --source-sha "$GITHUB_SHA" --result rf24-command-idempotency-verifier-result.json
          uv run python scripts/runtime/check_rf24_command_idempotency_artifact_safety.py --result rf24-command-idempotency-scanner-result.json rf24-command-idempotency-evidence.json rf24-command-idempotency-process-probes.json rf24-command-idempotency.log rf24-command-idempotency-verifier-result.json
          run_id=$(python -c 'import json; print(json.load(open("rf24-command-idempotency-evidence.json"))["acceptance_run_id"])')
          uv run python scripts/runtime/build_rf24_command_idempotency_manifest.py --output rf24-command-idempotency-safety-manifest.json --scanner-result rf24-command-idempotency-scanner-result.json --source-sha "$GITHUB_SHA" --run-id "$run_id" rf24-command-idempotency-evidence.json rf24-command-idempotency-process-probes.json rf24-command-idempotency.log rf24-command-idempotency-verifier-result.json rf24-command-idempotency-scanner-result.json
          uv run python scripts/runtime/check_rf24_command_idempotency_artifact_safety.py --result /tmp/rf24-command-idempotency-final-scanner.json rf24-command-idempotency-evidence.json rf24-command-idempotency-process-probes.json rf24-command-idempotency.log rf24-command-idempotency-verifier-result.json rf24-command-idempotency-scanner-result.json rf24-command-idempotency-safety-manifest.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('rf24-command-idempotency-safety-manifest.json').read_text()); s=json.loads(Path('rf24-command-idempotency-scanner-result.json').read_text())
          assert m['source_sha']==os.environ['GITHUB_SHA'] and m['finding_count']==s['finding_count']==0
          assert m['acceptance_run_id']==json.loads(Path('rf24-command-idempotency-evidence.json').read_text())['acceptance_run_id']
          for e in m['payloads']:
              p=Path(e['filename']); assert p.stat().st_size==e['size'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256']
          print('RF24_MANIFEST_HASH_INTEGRITY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-command-idempotency
          if-no-files-found: error
          path: |
            rf24-command-idempotency-evidence.json
            rf24-command-idempotency-process-probes.json
            rf24-command-idempotency.log
            rf24-command-idempotency-verifier-result.json
            rf24-command-idempotency-scanner-result.json
            rf24-command-idempotency-safety-manifest.json
