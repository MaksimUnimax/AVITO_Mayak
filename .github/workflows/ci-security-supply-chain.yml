name: CI Security and Supply Chain Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-security-supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  NO_COLOR: "1"
  UV_NO_SYSTEM_CONFIG: "1"
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  security-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.31
          python-version: 3.14.6
          activate-environment: true
          venv-path: .venv
          enable-cache: false
      - name: Verify Python and uv identity
        run: |
          test "$(python --version)" = "Python 3.14.6"
          test "$(python -c 'import sys; print(getattr(sys, "_is_gil_enabled")())')" = True
          test "$(python -c 'import sysconfig; print(sysconfig.get_config_var("Py_GIL_DISABLED"))')" = 0
          test "$(uv --version | awk '{print $2}')" = "0.11.31"
      - name: Check lock offline
        run: uv lock --check --offline
      - name: Check lock online
        run: uv lock --check
      - name: Prove dependency hashes
        run: |
          test "$(sha256sum pyproject.toml | cut -d' ' -f1)" = 5b0727b99214d58c9fab83a6567b9485afca34a93ba0358a7bbd6ea04f7dcb7d
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = e1faff1ce0f4d5dfd35480ab59d5d599fddf05c38fcd16a26c52098511476ab6
      - name: Sync frozen environment
        run: uv sync --frozen --all-groups --python 3.14.6
      - name: Check installed environment
        run: uv pip check
      - name: Verifier self-test
        run: python scripts/ci/verify_security_supply_chain.py --self-test --evidence-dir ci-evidence/security-supply-chain
      - name: Run complete security verifier
        run: python scripts/ci/verify_security_supply_chain.py --mode all --evidence-dir ci-evidence/security-supply-chain --venv .venv
      - name: Publish safe summary
        if: always()
        run: test -s ci-evidence/security-supply-chain/summary.txt && cat ci-evidence/security-supply-chain/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify evidence files exist
        if: always()
        run: |
          for f in self-test-evidence.json security-supply-chain-evidence.json secret-scan.json vulnerability-audit.json dependency-inventory.json installed-distribution-inventory.json license-inventory.json license-inventory.tsv summary.txt; do test -s "ci-evidence/security-supply-chain/$f"; done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-security-supply-chain-${{ github.sha }}
          path: ci-evidence/security-supply-chain/
          retention-days: 30
          include-hidden-files: false
          if-no-files-found: error
