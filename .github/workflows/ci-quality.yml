name: CI Quality Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_base_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-quality-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONNOUSERSITE: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MYPY_FORCE_COLOR: "0"
  NO_COLOR: "1"
  UV_NO_SYSTEM_CONFIG: "1"
  UV_PROJECT_ENVIRONMENT: .venv

jobs:
  canonical-full-regression:
    uses: ./.github/workflows/ci-full-regression.yml
    with:
      ref: ${{ github.sha }}

  integrity-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.31
          python-version: 3.14.6
          activate-environment: true
          venv-path: .venv
          enable-cache: false
      - name: Verify interpreter and uv identity
        run: |
          test "$(python --version)" = "Python 3.14.6"
          test "$(python -c 'import sys; print(getattr(sys, "_is_gil_enabled")())')" = True
          test "$(python -c 'import sysconfig; print(sysconfig.get_config_var("Py_GIL_DISABLED"))')" = 0
          test "$(uv --version | awk '{print $2}')" = "0.11.31"
      - name: Check lock offline
        run: uv lock --check --offline
      - name: Check lock online
        run: uv lock --check
      - name: Prove dependency bytes unchanged
        run: |
          test "$(sha256sum pyproject.toml | cut -d' ' -f1)" = 5b0727b99214d58c9fab83a6567b9485afca34a93ba0358a7bbd6ea04f7dcb7d
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = e1faff1ce0f4d5dfd35480ab59d5d599fddf05c38fcd16a26c52098511476ab6
      - name: Verify lock evidence
        run: python scripts/ci/verify_quality_baseline.py --mode lock --evidence-dir ci-evidence/integrity-lock --venv .venv
      - name: Verify integrity evidence exists
        run: test -s ci-evidence/integrity-lock/quality-evidence.json
      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integrity-lock-${{ github.sha }}
          path: ci-evidence/integrity-lock/
          retention-days: 30
          include-hidden-files: false
          if-no-files-found: error

  quality-suite:
    needs: integrity-lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.31
          python-version: 3.14.6
          activate-environment: true
          venv-path: .venv
          enable-cache: false
      - name: Sync isolated frozen environment
        run: uv sync --frozen --all-groups --python 3.14.6
      - name: Prove dependency bytes unchanged
        run: |
          test "$(sha256sum pyproject.toml | cut -d' ' -f1)" = 5b0727b99214d58c9fab83a6567b9485afca34a93ba0358a7bbd6ea04f7dcb7d
          test "$(sha256sum uv.lock | cut -d' ' -f1)" = e1faff1ce0f4d5dfd35480ab59d5d599fddf05c38fcd16a26c52098511476ab6
      - name: Verifier parser self-test
        run: python scripts/ci/verify_quality_baseline.py --self-test
      - name: Resolve comparison base
        id: comparison-base
        run: |
          sha=$(python scripts/ci/resolve_comparison_base.py --event-name "$GITHUB_EVENT_NAME" --pull-request-base "${{ github.event.pull_request.base.sha || '' }}" --push-before "${{ github.event.before || '' }}" --manual-base "${{ inputs.comparison_base_sha || '' }}")
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Run complete quality baseline
        env:
          CI_COMPARISON_BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: python scripts/ci/verify_quality_baseline.py --mode quality --base-sha "$CI_COMPARISON_BASE_SHA" --evidence-dir ci-evidence/quality-suite --venv .venv
      - name: Publish safe summary
        if: always()
        run: |
          test -s ci-evidence/quality-suite/summary.txt
          cat ci-evidence/quality-suite/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify quality evidence exists
        if: always()
        run: test -s ci-evidence/quality-suite/quality-evidence.json
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-quality-suite-${{ github.sha }}
          path: ci-evidence/quality-suite/
          retention-days: 30
          include-hidden-files: false
          if-no-files-found: error
