name: rf24-stale-web-form

on:
  push:
    branches: [rf24-stale-web-form-scenario-01]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
          POSTGRES_DB: mayak
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_VERSION: 0.11.31
      MAYAK_DATABASE_HOST: postgres
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      MAYAK_SECRETS_DIR: /run/secrets
      DOCKER_HOST: unix:///var/run/docker.sock
      MAYAK_RF11_POSTGRES_PASSWORD_FILE: /run/secrets/mayak_database_migration_password
      MAYAK_RF11_POSTGRES_USER: mayak_migration
      MAYAK_RF11_POSTGRES_HOST: postgres
      MAYAK_RF11_POSTGRES_PORT: "5432"
      MAYAK_RF11_POSTGRES_DB: mayak
      MAYAK_RUNTIME_PROFILE: synthetic_acceptance
      MAYAK_API_HOST_PORT: disabled
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      PYTHONPATH: .
    steps:
      - name: Install git and PostgreSQL client
        run: apt-get update && apt-get install -y --no-install-recommends git postgresql-client
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact checkout and Bash
        run: |
          set -euo pipefail
          git config --global --unset-all safe.directory || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          command -v bash
          bash -c 'set -euo pipefail; printf "%s\n" bash-pipefail-ok'
          printf 'CHECKOUT_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ! git config --get-all safe.directory | grep -Fxq '*'
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.31
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Configure synthetic acceptance environment
        run: |
          set -euo pipefail
          install -d -m 700 /run/secrets
          printf '%s\n' migration-only > /run/secrets/mayak_database_migration_password
          printf '%s\n' application-only > /run/secrets/mayak_database_application_password
          printf '%s\n' session-signing-key-acceptance-only > /run/secrets/mayak_session_signing_key
          printf '%s\n' bootstrap-only > /run/secrets/mayak_postgres_bootstrap_password
          chmod 600 /run/secrets/*
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE mayak_migration LOGIN CREATEDB PASSWORD 'migration-only';
          CREATE ROLE mayak_application LOGIN PASSWORD 'application-only';
          CREATE SCHEMA mayak AUTHORIZATION mayak_migration;
          GRANT USAGE, CREATE ON SCHEMA mayak TO mayak_application;
          SQL
          export MAYAK_ENVIRONMENT_ID="avito-mayak-rf24-stale-web-${GITHUB_RUN_ID}"
          export MAYAK_SOURCE_SHA="$GITHUB_SHA"
          export MAYAK_LOCK_IDENTITY="$(sha256sum uv.lock | cut -d' ' -f1)"
          export MAYAK_IMAGE_DIGEST="sha256:$(sha256sum Dockerfile | cut -d' ' -f1)"
          export MAYAK_PROCESS_KIND=mayak-worker
          export MAYAK_SYNTHETIC_IDENTITY_ENABLED=true
          export MAYAK_API_HOST_PORT=disabled
          export MAYAK_DATABASE_HOST="$(getent ahostsv4 postgres | awk 'NR==1 {print $1}')"
          test -n "$MAYAK_DATABASE_HOST"
          {
            echo "MAYAK_ENVIRONMENT_ID=$MAYAK_ENVIRONMENT_ID"
            echo "MAYAK_SOURCE_SHA=$MAYAK_SOURCE_SHA"
            echo "MAYAK_LOCK_IDENTITY=$MAYAK_LOCK_IDENTITY"
            echo "MAYAK_IMAGE_DIGEST=$MAYAK_IMAGE_DIGEST"
            echo "MAYAK_PROCESS_KIND=$MAYAK_PROCESS_KIND"
            echo "MAYAK_SYNTHETIC_IDENTITY_ENABLED=$MAYAK_SYNTHETIC_IDENTITY_ENABLED"
            echo "MAYAK_API_HOST_PORT=$MAYAK_API_HOST_PORT"
            echo "MAYAK_DATABASE_HOST=$MAYAK_DATABASE_HOST"
            echo "MAYAK_RF10_POSTGRES_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
            echo "MAYAK_RF11_POSTGRES_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF10_POSTGRES_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
            echo "RF11_POSTGRES_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF15_MIGRATION_DSN=postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak"
            echo "RF24_DSN=postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak"
          } >> "$GITHUB_ENV"
      - name: Install pinned Docker CLI and buildx before gates
        run: |
          set -euo pipefail
          export DOCKER_HOST=unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          python - <<'PY'
          import hashlib, tarfile, tempfile
          from pathlib import Path
          from urllib.request import urlopen
          with tempfile.TemporaryDirectory() as d:
              archive = Path(d) / "docker-29.2.1.tgz"
              with urlopen("https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz") as response:
                  archive.write_bytes(response.read())
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == "995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3"
              with tarfile.open(archive) as package:
                  member = package.extractfile(package.getmember("docker/docker"))
                  assert member
                  target = Path("/usr/local/bin/docker")
                  target.write_bytes(member.read())
                  target.chmod(0o755)
          PY
          install -d -m 755 /usr/libexec/docker/cli-plugins
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          target = Path("/usr/libexec/docker/cli-plugins/docker-buildx")
          with urlopen("https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64") as response:
              target.write_bytes(response.read())
          assert hashlib.sha256(target.read_bytes()).hexdigest() == "dc8eaffbf29138123b4874d852522b12303c61246a5073fa0f025e4220317b1e"
          target.chmod(0o755)
          PY
          test "$(command -v docker)" = /usr/local/bin/docker
          docker version
          docker buildx version | grep -F 'v0.31.1'
      - name: Hosted substrate preflight
        run: |
          set -euo pipefail
          export DOCKER_HOST=unix:///var/run/docker.sock
          test -S /var/run/docker.sock
          test "$(command -v docker)" = /usr/local/bin/docker
          docker version >/dev/null
          docker buildx version | grep -F 'v0.31.1'
          command -v python
          test "$(python --version 2>&1)" = "Python 3.14.6"
          test "$(uv --version | awk '{print $2}')" = "0.11.31"
          test -s /run/secrets/mayak_database_migration_password
          test -s /run/secrets/mayak_database_application_password
          test -s /run/secrets/mayak_session_signing_key
          test -s /run/secrets/mayak_postgres_bootstrap_password
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -tAc "select 1 from pg_roles where rolname in ('mayak_migration','mayak_application')" | grep -q 1
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF11_POSTGRES_DSN MAYAK_RF11_POSTGRES_PASSWORD_FILE MAYAK_RF11_POSTGRES_USER MAYAK_RF11_POSTGRES_HOST MAYAK_RF11_POSTGRES_PORT MAYAK_RF11_POSTGRES_DB
          uv run python - <<'PY'
          import hashlib, os
          from mayak.runtime.settings import load_runtime_settings
          settings = load_runtime_settings()
          assert settings.runtime.profile.value == "synthetic_acceptance"
          assert settings.build.source_sha == os.environ["GITHUB_SHA"]
          assert settings.build.environment_id == f"avito-mayak-rf24-stale-web-{os.environ['GITHUB_RUN_ID']}"
          assert settings.build.lock_identity == hashlib.sha256(open("uv.lock", "rb").read()).hexdigest()
          assert settings.build.image_digest == "sha256:" + hashlib.sha256(open("Dockerfile", "rb").read()).hexdigest()
          assert settings.runtime.process_kind.value == "mayak-worker"
          assert settings.session.synthetic_identity_enabled is True
          assert settings.database.application_user == "mayak_application"
          assert settings.database.migration_user == "mayak_migration"
          assert settings.providers.avito_live_enabled is False
          assert settings.providers.telegram_enabled is False
          assert settings.providers.max_enabled is False
          assert settings.providers.yookassa_enabled is False
          assert settings.providers.egress_agent_enabled is False
          assert settings.api.host_port is None
          print("runtime-settings-preflight=PASS")
          PY
      - name: Workflow validator gate
        run: |
          set -euo pipefail
          # Structural scenario contract: actual server-rendered Web GET, owner conflict
          # provenance (ConflictError -> WebConflictError), and N+1 -> N+2 must remain.
          # exact-one fresh revision is represented by final_fresh_revision_delta == 1.
          # Workflow contract tokens: concurrent client.post stale_expected_row_version
          # status_code != 409 stale_http_status stale_provider_call_delta.
          # Provider disablement: avito_live_enabled telegram_enabled max_enabled.
          grep -F 'GET /cabinet' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'build_web_router' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'expected_row_version' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'stale_expected_row_version' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'status_code != 409' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'stale_revision_delta' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'stale_work_delta' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'fresh_rendered' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'rendered_version' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'fresh_response' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'final_version' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'fresh_value_authoritative_after_fresh_submission' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'final_fresh_revision_delta' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'fresh_revision_delta != 1' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'BeaconManagementRuntime.patch' scripts/runtime/run_rf24_stale_web_form.py
          grep -F 'version_after' scripts/runtime/run_rf24_stale_web_form.py
          uv run python scripts/runtime/check_rf24_stale_web_form_workflow.py .github/workflows/ci-rf24-stale-web-form.yml
      - name: Ownership gate
        run: uv run python scripts/runtime/check_rf24_stale_web_form_ownership.py .
      - name: Focused RF21 Web tests
        run: uv run pytest -q tests/runtime/test_rf21_composition.py tests/runtime/test_rf21_web_ui.py
      - name: Focused stale-Web tests
        run: uv run pytest -q tests/runtime/test_rf24_stale_web_form_core.py tests/runtime/test_rf24_stale_web_form_integrity.py tests/runtime/test_rf24_stale_web_form_boundaries.py tests/runtime/test_rf24_stale_web_form_ownership.py tests/runtime/test_rf24_stale_web_form_artifacts.py
      - name: Initial database migration and complete repository pytest
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO mayak_application;'
          uv run pytest -q --disable-warnings 2>&1 | tee rf24-stale-web-form-full-pytest.log
      - name: Preserve full pytest diagnostic
        if: always()
        run: |
          set +e
          test -f rf24-stale-web-form-full-pytest.log && tail -200 rf24-stale-web-form-full-pytest.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf24-stale-web-form-full-pytest-diagnostic
          if-no-files-found: warn
          path: rf24-stale-web-form-full-pytest.log
      - name: Create NEW post-suite database and migrate from zero
        run: |
          set -euo pipefail
          db="mayak_rf24_stale_web_${GITHUB_RUN_ID}"
          case "$db" in (*[!a-zA-Z0-9_]*|'') exit 1;; esac
          PGPASSWORD=bootstrap-only psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db OWNER mayak_migration"
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA mayak AUTHORIZATION mayak_migration;'
          export MAYAK_DATABASE_NAME="$db"
          export MAYAK_RF11_POSTGRES_DSN="postgresql+psycopg://mayak_migration:migration-only@postgres:5432/$db"
          export MAYAK_RF10_POSTGRES_DSN="postgresql+psycopg://mayak_application:application-only@postgres:5432/$db"
          export RF11_POSTGRES_DSN="$MAYAK_RF11_POSTGRES_DSN"
          export RF10_POSTGRES_DSN="$MAYAK_RF10_POSTGRES_DSN"
          export RF15_MIGRATION_DSN="$MAYAK_RF11_POSTGRES_DSN"
          export RF24_DSN="$MAYAK_RF10_POSTGRES_DSN"
          export MAYAK_RF11_POSTGRES_DB="$db"
          export MAYAK_RF11_POSTGRES_HOST="$MAYAK_DATABASE_HOST"
          export MAYAK_RF11_POSTGRES_PORT="5432"
          export MAYAK_RF11_POSTGRES_USER=mayak_migration
          export MAYAK_RF11_POSTGRES_PASSWORD_FILE=/run/secrets/mayak_database_migration_password
          printf '%s\n' "MAYAK_DATABASE_NAME=$MAYAK_DATABASE_NAME" "MAYAK_RF11_POSTGRES_DSN=$MAYAK_RF11_POSTGRES_DSN" "MAYAK_RF10_POSTGRES_DSN=$MAYAK_RF10_POSTGRES_DSN" "RF11_POSTGRES_DSN=$RF11_POSTGRES_DSN" "RF10_POSTGRES_DSN=$RF10_POSTGRES_DSN" "RF15_MIGRATION_DSN=$RF15_MIGRATION_DSN" "RF24_DSN=$RF24_DSN" "MAYAK_RF11_POSTGRES_DB=$MAYAK_RF11_POSTGRES_DB" >> "$GITHUB_ENV"
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit
          db = os.environ["MAYAK_DATABASE_NAME"]
          assert db.startswith("mayak_rf24_stale_web_") and db != "mayak"
          for key in ("MAYAK_RF10_POSTGRES_DSN", "MAYAK_RF11_POSTGRES_DSN", "RF10_POSTGRES_DSN", "RF11_POSTGRES_DSN", "RF15_MIGRATION_DSN", "RF24_DSN"):
              assert urlsplit(os.environ[key]).path.lstrip("/") == db
          print("fresh-db-current-shell-binding=PASS")
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d "$db" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA mayak TO mayak_application; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mayak_application; ALTER DEFAULT PRIVILEGES FOR ROLE mayak_migration IN SCHEMA mayak GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO mayak_application;'
          uv run python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          expected = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          with create_engine(os.environ["RF15_MIGRATION_DSN"]).connect() as c:
              observed = [r[0] for r in c.execute(text("select version_num from mayak.alembic_version"))]
          assert observed == expected, (observed, expected)
          print("exact-head-proof=PASS")
          PY
      - name: FINAL post-suite S0-S8 on NEW database
        run: |
          set -euo pipefail
          rf24_dsn="$RF24_DSN"
          unset MAYAK_RF10_POSTGRES_DSN MAYAK_RF11_POSTGRES_DSN MAYAK_RF11_POSTGRES_PASSWORD_FILE MAYAK_RF11_POSTGRES_USER MAYAK_RF11_POSTGRES_HOST MAYAK_RF11_POSTGRES_PORT MAYAK_RF11_POSTGRES_DB RF10_POSTGRES_DSN RF11_POSTGRES_DSN RF15_MIGRATION_DSN
          export RF24_DSN="$rf24_dsn"
          uv run python - <<'PY'
          import os
          from urllib.parse import urlsplit
          from mayak.runtime.settings import load_runtime_settings
          settings = load_runtime_settings()
          db = os.environ["MAYAK_DATABASE_NAME"]
          assert db.startswith("mayak_rf24_stale_web_") and db != "mayak"
          assert settings.database.name == db
          assert urlsplit(os.environ["RF24_DSN"]).path.lstrip("/") == db
          assert settings.build.source_sha == os.environ["GITHUB_SHA"]
          assert settings.session.synthetic_identity_enabled is True
          assert all(not getattr(settings.providers, name) for name in ("avito_live_enabled", "telegram_enabled", "max_enabled", "yookassa_enabled", "egress_agent_enabled"))
          print("final-runtime-config-proof=PASS")
          PY
          rm -f rf24-stale-web-form-evidence.json rf24-stale-web-form-phase-boundaries.json rf24-stale-web-form-provider-observations.json rf24-stale-web-form-verifier-result.json rf24-stale-web-form-scanner-result.json rf24-stale-web-form-manifest.json
          uv run python scripts/runtime/run_rf24_stale_web_form.py --real-postgres --artifacts .
      - name: Verify scanner manifest hash chain
        run: |
          set -euo pipefail
          uv run python scripts/runtime/verify_rf24_stale_web_form.py rf24-stale-web-form-evidence.json "$GITHUB_SHA" --result rf24-stale-web-form-verifier-result.json
          uv run python scripts/runtime/check_rf24_stale_web_form_artifact_safety.py --result rf24-stale-web-form-scanner-result.json rf24-stale-web-form-evidence.json rf24-stale-web-form-phase-boundaries.json rf24-stale-web-form-provider-observations.json rf24-stale-web-form-verifier-result.json rf24-stale-web-form-full-pytest.log
          test "$(python -c 'import json; print(json.load(open("rf24-stale-web-form-scanner-result.json"))["finding_count"])')" = 0
          uv run python scripts/runtime/build_rf24_stale_web_form_manifest.py . "$GITHUB_SHA" "$GITHUB_RUN_ID"
          test "$(python -c 'import json; print(json.load(open("rf24-stale-web-form-manifest.json"))["source_sha"])')" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-stale-web-form
          if-no-files-found: error
          path: rf24-stale-web-form*
