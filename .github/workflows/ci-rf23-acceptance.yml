name: RF23 Cross-module API and command wiring acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    env:
      RF23_TECHNICAL_ID: RF23-CROSS-MODULE-API-COMMAND-WIRING-01-CORRECTIVE-08
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify hosted Docker and checkout prerequisites
        run: |
          set -euo pipefail
          command -v docker
          command -v git
          test -S /var/run/docker.sock
          docker version
          docker info
          docker buildx version
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run the authoritative RF23 acceptance chain
        run: scripts/runtime/run_rf23_acceptance_chain.sh
      - name: Upload authoritative RF23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rf23-cross-module-api-command-wiring
          if-no-files-found: error
          path: |
            rf23-evidence.json
            rf23-runtime-probes.json
            rf23-api.log
            rf23-full-pytest.log
            rf23-safety-manifest.json
