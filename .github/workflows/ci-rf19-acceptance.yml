name: RF19 MAX Adapter acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rf19:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      RF10_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF12_ACCEPTANCE_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      MAYAK_RF10_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      MAYAK_RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF15_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF17_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF17_APPLICATION_DSN: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
      RF18_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF18_DATABASE_URL: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
      RF19_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
      RF19_DATABASE_URL: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env: {POSTGRES_USER: mayak, POSTGRES_PASSWORD: rf19_bootstrap_synthetic, POSTGRES_DB: mayak}
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14.6'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.11.31'}
      - run: uv sync --frozen --all-groups --python 3.14.6
      - name: Create synthetic database secrets and aliases
        run: |
          install -d -m 700 -o "$(id -u)" -g "$(id -g)" /run/secrets
          umask 077
          printf '%s' 'rf19_bootstrap_synthetic' > /run/secrets/mayak_postgres_bootstrap_password
          printf '%s' 'rf19_migration_synthetic' > /run/secrets/mayak_database_migration_password
          printf '%s' 'rf19_application_synthetic' > /run/secrets/mayak_database_application_password
          {
            echo 'RF19_MIGRATION_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'RF19_DATABASE_URL=postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak'
            echo 'RF15_MIGRATION_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'RF15_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'RF17_MIGRATION_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'RF17_APPLICATION_DSN=postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak'
            echo 'RF18_MIGRATION_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'RF18_DATABASE_URL=postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak'
            echo 'MAYAK_RF10_POSTGRES_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
            echo 'MAYAK_RF11_POSTGRES_DSN=postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak'
          } >> "$GITHUB_ENV"
      - name: Bootstrap and migrate current head
        run: |
          uv run python - <<'PY'
          from mayak.persistence.bootstrap import bootstrap_database
          from mayak.persistence.config import BootstrapDatabaseSettings, DatabaseEndpoint
          bootstrap_database(settings=BootstrapDatabaseSettings(endpoint=DatabaseEndpoint(host='postgres')))
          PY
          uv run alembic upgrade head
      - name: Grant exact MAX application boundary
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['RF19_MIGRATION_DSN'])
          with engine.begin() as c:
              c.execute(text("""do $$ declare r record; begin
                for r in select table_schema, table_name from information_schema.tables where table_schema='mayak' and table_name <> 'alembic_version'
                loop execute format('revoke insert, update, delete, truncate, references, trigger on table %I.%I from mayak_application', r.table_schema, r.table_name); end loop; end $$;"""))
              c.execute(text('grant usage on schema mayak to mayak_application'))
              c.execute(text('grant select, insert, update, delete on table mayak.max_inbound_events, mayak.max_identity_mappings, mayak.max_delivery_mappings, mayak.max_miniapp_nonces to mayak_application'))
              c.execute(text('grant select on table mayak.identity_accounts, mayak.identity_provider_links, mayak.notification_delivery_attempts to mayak_application'))
              c.execute(text('revoke all on all sequences in schema mayak from mayak_application'))
      - run: uv run pytest -q tests/runtime/test_rf19_max_adapter_runtime.py tests/contract/test_max_adapter_semantic_contract_exports.py tests/architecture/test_max_adapter_semantic_boundaries.py
      - name: Ruff RF19 changed Python surface
        run: >-
          uv run ruff check
          scripts/runtime/check_rf19_max_live.py
          scripts/runtime/run_rf19_postgres_acceptance.py
          scripts/runtime/verify_rf19_acceptance.py
          src/mayak/modules/max_adapter/__init__.py
          src/mayak/modules/max_adapter/mini_app.py
          src/mayak/modules/max_adapter/runtime.py
          src/mayak/modules/max_adapter/transport.py
          src/mayak/persistence/config.py
          tests/architecture/test_max_adapter_semantic_boundaries.py
          tests/contract/test_max_adapter_semantic_contract_exports.py
          tests/runtime/test_rf19_max_adapter_runtime.py
      - run: uv run python scripts/runtime/run_rf19_postgres_acceptance.py --dsn "$RF19_DATABASE_URL" --fixture-dsn "$RF19_MIGRATION_DSN" --candidate-sha "$GITHUB_SHA" --output rf19-acceptance-evidence.json
      - run: uv run python scripts/runtime/verify_rf19_acceptance.py rf19-acceptance-evidence.json
      - name: Hosted full repository regression
        env:
          RF10_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF12_ACCEPTANCE_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          MAYAK_RF10_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          MAYAK_RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF15_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF17_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF17_APPLICATION_DSN: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
          RF18_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF18_DATABASE_URL: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
          RF19_MIGRATION_DSN: postgresql+psycopg://mayak_migration:rf19_migration_synthetic@postgres:5432/mayak
          RF19_DATABASE_URL: postgresql+psycopg://mayak_application:rf19_application_synthetic@postgres:5432/mayak
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee rf19-full-pytest.log
      - name: Semantic artifact safety scan
        run: |
          uv run python - <<'PY'
          import json
          import re
          from pathlib import Path

          evidence = json.loads(Path("rf19-acceptance-evidence.json").read_text(encoding="utf-8"))
          safe_zero_counters = {
              "live_network_call_count",
              "real_secret_read_count",
              "raw_provider_payload_persisted_count",
          }
          forbidden_key_fragments = (
              "authorization", "bearer", "private_key", "webapp", "provider_payload",
              "provider_body", "webhook_secret", "token", "secret",
          )
          forbidden_value_patterns = (
              re.compile(r"-----BEGIN [^-]*PRIVATE KEY-----"),
              re.compile(r"(?i)authorization\s*[:=]\s*\S+"),
              re.compile(r"(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{12,}"),
          )

          def walk(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      key_path = path + (str(key),)
                      normalized = str(key).lower()
                      if normalized in safe_zero_counters:
                          continue
                      if any(fragment in normalized for fragment in forbidden_key_fragments):
                          if child not in (None, "", 0, False, [], {}):
                              raise SystemExit(f"forbidden sensitive material at {'.'.join(key_path)}")
                      walk(child, key_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, path + (str(index),))
              elif isinstance(value, str):
                  for pattern in forbidden_value_patterns:
                      if pattern.search(value):
                          raise SystemExit(f"forbidden sensitive material at {'.'.join(path)}")

          walk(evidence)
          print("RF19 semantic artifact safety verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rf19-max-adapter-acceptance
          path: |
            rf19-acceptance-evidence.json
            rf19-full-pytest.log
