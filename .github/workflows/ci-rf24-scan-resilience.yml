name: RF24 scan runtime resilience

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resilience:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: python:3.14.6-bookworm
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    services:
      postgres:
        image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: mayak
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: bootstrap-only
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      UV_VERSION: 0.11.31
      MAYAK_DATABASE_HOST: postgres
      MAYAK_DATABASE_PORT: "5432"
      MAYAK_DATABASE_NAME: mayak
      MAYAK_DATABASE_APPLICATION_USER: mayak_application
      MAYAK_DATABASE_MIGRATION_USER: mayak_migration
      RF10_POSTGRES_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
      MAYAK_RF10_POSTGRES_DSN: postgresql+psycopg://mayak_application:application-only@postgres:5432/mayak
      MAYAK_RF11_POSTGRES_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
      MAYAK_RF11_POSTGRES_PASSWORD_FILE: /run/secrets/mayak_database_migration_password
      MAYAK_RF11_POSTGRES_USER: mayak_migration
      MAYAK_RF11_POSTGRES_HOST: postgres
      MAYAK_RF11_POSTGRES_PORT: "5432"
      MAYAK_RF11_POSTGRES_DB: mayak
      MAYAK_RUNTIME_PROFILE: synthetic_acceptance
      MAYAK_API_INTERNAL_PORT: "18080"
      MAYAK_API_BIND_HOST: 127.0.0.1
      MAYAK_API_HOST_PORT: disabled
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Install git for exact source identity gate
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Trust actual container workspace
        run: |
          set -euo pipefail
          workspace="$(pwd -P)"
          test -n "$GITHUB_WORKSPACE"
          test "$GITHUB_WORKSPACE" = "$workspace"
          test "$(git rev-parse --show-toplevel)" = "$workspace"
          git config --get-all safe.directory | grep -Fxq "$workspace"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Exact SHA gate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "github_sha=$GITHUB_SHA"
          echo "expected_sha=$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -f "$GITHUB_WORKSPACE/.github/workflows/ci-rf24-scan-resilience.yml"
      - name: Deterministic frozen dependency sync
        run: |
          python --version
          uv --version
          uv sync --frozen --all-groups
      - name: Bootstrap PostgreSQL 18 and migrate
        env:
          PGPASSWORD: bootstrap-only
          RF15_MIGRATION_DSN: postgresql+psycopg://mayak_migration:migration-only@postgres:5432/mayak
        run: |
          apt-get update && apt-get install -y --no-install-recommends postgresql-client
          psql -h postgres -U mayak -d mayak -v ON_ERROR_STOP=1 -c "CREATE ROLE mayak_migration LOGIN PASSWORD 'migration-only'; CREATE ROLE mayak_application LOGIN PASSWORD 'application-only'; ALTER ROLE mayak_migration CREATEDB; CREATE SCHEMA mayak AUTHORIZATION mayak_migration; GRANT USAGE, CREATE ON SCHEMA mayak TO mayak_application;"
          install -d -m 700 /run/secrets
          printf '%s' migration-only > /run/secrets/mayak_database_migration_password
          printf '%s' application-only > /run/secrets/mayak_database_application_password
          chmod 600 /run/secrets/mayak_database_*_password
          uv run alembic upgrade head
          PGPASSWORD=migration-only psql -h postgres -U mayak_migration -d mayak -c "GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application; GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application;"
      - name: Install hosted Docker CLI
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen
          import tarfile
          import tempfile

          expected_sha256 = "995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3"
          with tempfile.TemporaryDirectory() as directory:
              archive = Path(directory) / "docker.tgz"
              with urlopen("https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz") as response:
                  archive.write_bytes(response.read())
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected_sha256:
                  raise RuntimeError("Docker CLI archive digest mismatch")
              with tarfile.open(archive) as package:
                  members = package.getmembers()
                  if any(member.name.startswith("/") or ".." in Path(member.name).parts for member in members):
                      raise RuntimeError("Docker CLI archive contains an unsafe member")
                  member = package.getmember("docker/docker")
                  if not member.isfile():
                      raise RuntimeError("Docker CLI archive member is not a regular file")
                  member = package.extractfile(member)
                  if member is None:
                      raise RuntimeError("Docker CLI binary missing from pinned archive")
                  target = Path("/usr/local/bin/docker")
                  target.write_bytes(member.read())
          target.chmod(0o755)
      - name: Install pinned hosted buildx plugin
        run: |
          set -euo pipefail
          install -d -m 755 /usr/libexec/docker/cli-plugins
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen

          expected_sha256 = "dc8eaffbf29138123b4874d852522b12303c61246a5073fa0f025e4220317b1e"
          target = Path("/usr/libexec/docker/cli-plugins/docker-buildx")
          with urlopen("https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64") as response:
              target.write_bytes(response.read())
          if hashlib.sha256(target.read_bytes()).hexdigest() != expected_sha256:
              raise RuntimeError("buildx plugin digest mismatch")
          target.chmod(0o755)
      - name: Prove hosted execution environment
        run: |
          set -euo pipefail
          workspace="$(pwd -P)"
          python --version
          uv --version
          git --version
          test "$GITHUB_WORKSPACE" = "$workspace"
          test "$(git rev-parse --show-toplevel)" = "$workspace"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config --get-all safe.directory | grep -Fxq "$workspace"
          ! git config --get-all safe.directory | grep -Fxq '*'
          test -S /var/run/docker.sock
          test -x /usr/local/bin/docker
          test -x /usr/libexec/docker/cli-plugins/docker-buildx
          docker version
          docker buildx version | grep -F 'v0.31.1'
      - name: Focused tests and affected gates
        run: |
          uv run pytest -q tests/runtime/test_rf24_scan_resilience.py tests/runtime/test_rf24_scan_resilience_integrity.py
          uv run ruff check src/mayak/runtime/rf24_scan_resilience.py src/mayak/runtime/rf24_provenance.py src/mayak/runtime/worker.py src/mayak/modules/scan_orchestration/repository.py src/mayak/modules/scan_orchestration/services.py scripts/runtime/run_rf24_scan_resilience.py scripts/runtime/verify_rf24_scan_resilience.py scripts/runtime/check_rf24_scan_resilience_artifact_safety.py scripts/runtime/build_rf24_scan_resilience_manifest.py tests/runtime/test_rf24_scan_resilience.py tests/runtime/test_rf24_scan_resilience_integrity.py
          uv run mypy --explicit-package-bases scripts/runtime/run_rf24_scan_resilience.py scripts/runtime/verify_rf24_scan_resilience.py src/mayak/runtime/rf24_scan_resilience.py
          uv run lint-imports
      - name: Execute seven real scenarios
        run: |
          uv run python scripts/runtime/run_rf24_scan_resilience.py --repo-root "$GITHUB_WORKSPACE" --output rf24-scan-resilience-evidence.json --probes rf24-scan-resilience-process-probes.json --log rf24-scan-resilience.log --source-sha "$GITHUB_SHA"
          uv run python scripts/runtime/verify_rf24_scan_resilience.py --evidence rf24-scan-resilience-evidence.json --source-sha "$GITHUB_SHA"
          uv run python scripts/runtime/check_rf24_scan_resilience_artifact_safety.py --result rf24-scan-resilience-scanner-result.json rf24-scan-resilience-evidence.json rf24-scan-resilience-process-probes.json rf24-scan-resilience.log
          uv run python scripts/runtime/build_rf24_scan_resilience_manifest.py --output rf24-scan-resilience-safety-manifest.json --scanner-result rf24-scan-resilience-scanner-result.json --source-sha "$GITHUB_SHA" --run-id "$(python -c 'import json; print(json.load(open("rf24-scan-resilience-evidence.json"))["acceptance_run_id"])')" rf24-scan-resilience-evidence.json rf24-scan-resilience-process-probes.json rf24-scan-resilience.log rf24-scan-resilience-scanner-result.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("rf24-scan-resilience-safety-manifest.json").read_text())
          scanner_path = Path("rf24-scan-resilience-scanner-result.json")
          scanner = json.loads(scanner_path.read_text())
          expected_payloads = {
              "rf24-scan-resilience-evidence.json",
              "rf24-scan-resilience-process-probes.json",
              "rf24-scan-resilience.log",
              "rf24-scan-resilience-scanner-result.json",
          }
          entries = manifest.get("payloads")
          if manifest.get("source_sha") != os.environ["GITHUB_SHA"] or manifest.get("finding_count") != 0:
              raise SystemExit("manifest identity or finding count mismatch")
          if scanner.get("scanner") != "rf24-scan-resilience-artifact-safety" or scanner.get("finding_count") != 0:
              raise SystemExit("scanner result is not a zero-finding PASS")
          if {entry.get("basename") for entry in entries} != expected_payloads:
              raise SystemExit("manifest payload inventory mismatch")
          scanner_binding = manifest.get("scanner_result")
          if scanner_binding != {"basename": scanner_path.name, "sha256": hashlib.sha256(scanner_path.read_bytes()).hexdigest()}:
              raise SystemExit("scanner result is not hash-bound")
          for entry in entries:
              path = Path(entry["basename"])
              if not path.is_file() or path.stat().st_size != entry.get("size") or hashlib.sha256(path.read_bytes()).hexdigest() != entry.get("sha256"):
                  raise SystemExit(f"manifest hash mismatch: {path}")
          print("RF24_MANIFEST_HASH_INTEGRITY=PASS")
          PY
          uv run python scripts/runtime/check_rf24_scan_resilience_artifact_safety.py rf24-scan-resilience-evidence.json rf24-scan-resilience-process-probes.json rf24-scan-resilience.log rf24-scan-resilience-scanner-result.json rf24-scan-resilience-safety-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rf24-scan-runtime-resilience
          if-no-files-found: error
          path: |
            rf24-scan-resilience-evidence.json
            rf24-scan-resilience-process-probes.json
            rf24-scan-resilience.log
            rf24-scan-resilience-scanner-result.json
            rf24-scan-resilience-safety-manifest.json
