name: RF26 operability

on:
  push:
    branches:
      - rf26-observability-backup-recovery-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rf26:
    runs-on: ubuntu-24.04
    container: python:3.14.6-bookworm@sha256:ec1b01f92099324b965a51c8547d9a3b71fedc99f6991a89662e7358f9b167c9
    services:
      mayak-postgres:
        image: postgres:18-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: mayak
          POSTGRES_USER: mayak
          POSTGRES_PASSWORD: rf26-bootstrap-only
        options: >-
          --health-cmd "pg_isready -U mayak -d mayak"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      UV_VERSION: 0.11.31
      MAYAK_AVITO_LIVE_ENABLED: "false"
      MAYAK_TELEGRAM_ENABLED: "false"
      MAYAK_MAX_ENABLED: "false"
      MAYAK_YOOKASSA_ENABLED: "false"
      MAYAK_EGRESS_AGENT_ENABLED: "false"
      RF26_TECHNICAL_ID: RF26-OBSERVABILITY-BACKUP-RECOVERY-01
      DOCKER_HOST: unix:///var/run/docker.sock
    defaults:
      run:
        shell: bash
    steps:
      - name: Install task-local Git transport prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
      - name: H0 checkout exact candidate and prove ancestor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: H0b establish persistent cross-step Git trust
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          {
            printf '%s\n' 'GIT_CONFIG_COUNT=1'
            printf '%s\n' 'GIT_CONFIG_KEY_0=safe.directory'
            printf 'GIT_CONFIG_VALUE_0=%s\n' "$workspace"
          } >> "$GITHUB_ENV"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$workspace"
          test "$workspace" = "$(realpath "$GITHUB_WORKSPACE")"
      - name: H0c prove cross-step Git trust
        run: |
          set -euo pipefail
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          test "${GIT_CONFIG_COUNT:-}" = 1
          test "${GIT_CONFIG_KEY_0:-}" = safe.directory
          test "${GIT_CONFIG_VALUE_0:-}" = "$workspace"
          test "$(git rev-parse --show-toplevel)" = "$workspace"
          test -n "$(git rev-parse HEAD)"
      - name: H0d candidate SHA identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: H0e authoritative base identity
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 74b36bc53e8b3f0ae0e6a4f6ccb1373eeccce23d)" = 74b36bc53e8b3f0ae0e6a4f6ccb1373eeccce23d
      - name: H1a immutable workflow substrate contract
        run: |
          set -euo pipefail
          grep -Eq 'actions/checkout@[0-9a-f]{40}' .github/workflows/ci-rf26-operability.yml
          grep -Eq 'astral-sh/setup-uv@[0-9a-f]{40}' .github/workflows/ci-rf26-operability.yml
          grep -Eq 'actions/upload-artifact@[0-9a-f]{40}' .github/workflows/ci-rf26-operability.yml
          python -m scripts.runtime.check_rf26_workflow_contract .github/workflows/ci-rf26-operability.yml
      - name: H1b immutable job-container identity
        run: |
          set -euo pipefail
          grep -F 'python:3.14.6-bookworm@sha256:ec1b01f92099324b965a51c8547d9a3b71fedc99f6991a89662e7358f9b167c9' .github/workflows/ci-rf26-operability.yml
      - name: H1c immutable PostgreSQL service identity
        run: |
          set -euo pipefail
          grep -F 'postgres:18-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382' .github/workflows/ci-rf26-operability.yml
      - name: H1d deterministic service discovery contract
        run: |
          set -euo pipefail
          grep -F 'label=com.docker.compose.service=mayak-postgres' .github/workflows/ci-rf26-operability.yml
          grep -F 'docker image inspect' .github/workflows/ci-rf26-operability.yml
      - name: H1e deterministic Docker and Compose client identity
        run: |
          set -euo pipefail
          docker_cli_dir="$RUNNER_TEMP/rf26-docker-cli"
          docker_config="$RUNNER_TEMP/rf26-docker-config"
          compose_plugin_dir="$docker_config/cli-plugins"
          install -d -m 700 "$docker_cli_dir" "$compose_plugin_dir"
          curl -fsSLo "$RUNNER_TEMP/docker-29.2.1.tgz" https://download.docker.com/linux/static/stable/x86_64/docker-29.2.1.tgz
          echo '995b1d0b51e96d551a3b49c552c0170bc6ce9f8b9e0866b8c15bbc67d1cf93a3  docker-29.2.1.tgz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/docker-29.2.1.tgz" --strip-components=1 -C "$docker_cli_dir" docker/docker
          curl -fsSLo "$compose_plugin_dir/docker-compose" https://github.com/docker/compose/releases/download/v5.0.2/docker-compose-linux-x86_64
          echo '2d880f723d3da7c779c54fdaea91a842fca8af55d1397f1ed8d7cbab3dd7af67 *docker-compose' | (cd "$compose_plugin_dir" && sha256sum -c -)
          chmod 0755 "$compose_plugin_dir/docker-compose"
          export PATH="$docker_cli_dir:$PATH" DOCKER_CONFIG="$docker_config"
          printf 'PATH=%s\nDOCKER_CONFIG=%s\n' "$PATH" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          test "$(docker version --format '{{.Client.Version}}')" = 29.2.1
          test "$(docker compose version)" = 'Docker Compose version v5.0.2'
      - name: H1f deterministic service discovery and identity
        run: |
          set -euo pipefail
          mapfile -t candidates < <(docker ps --filter label=com.docker.compose.service=mayak-postgres --filter health=healthy --format '{{.ID}}')
          test "${#candidates[@]}" -eq 1
          container="${candidates[0]}"
          image_id="$(docker inspect --format '{{.Image}}' "$container")"
          image_identity="$(docker image inspect --format '{{json .RepoDigests}}' "$image_id")"
          test "$image_identity" = '["postgres@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382"]'
          printf 'RF26_POSTGRES_CONTAINER=%s\n' "$container" >> "$GITHUB_ENV"
      - name: H2 Python 3.14 and frozen dependencies
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: ${{ env.UV_VERSION }}
      - name: H2 sync
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run python --version | grep -E '^Python 3\.14\.'
          uv --version | grep -F "${UV_VERSION}"
      - name: H3 observability correlation health
        run: uv run pytest -q tests/runtime/test_rf26_observability_backup.py -k 'correlation or formatter or message or liveness or readiness or diagnostics'
      - name: H4 backup root retention redaction adversarial gates
        run: uv run pytest -q tests/runtime/test_rf26_observability_backup.py -k 'backup or retention or symlink or tamper or random or unknown'
      - name: H5 interruption and reconciliation gates
        run: |
          uv run pytest -q tests/runtime/test_alembic_migration_serialization.py tests/runtime/test_rf24_notification_ambiguous_send.py tests/runtime/test_rf24_readiness_process.py
      - name: H6 affected static gates
        run: uv run ruff check src/mayak/platform src/mayak/entrypoints/api/application.py src/mayak/runtime scripts/runtime/rf26_operability.py tests/runtime/test_rf26_observability_backup.py
      - name: H7a Docker socket boundary
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
      - name: H7b Compose config boundary
        run: |
          set -euo pipefail
          export MAYAK_SOURCE_SHA="$GITHUB_SHA"
          export MAYAK_LOCK_IDENTITY="$(sha256sum uv.lock | cut -d' ' -f1)"
          export MAYAK_BUILD_INPUT_DIGEST="$(sha256sum Dockerfile compose.yaml | sha256sum | cut -d' ' -f1)"
          export MAYAK_IMAGE_DIGEST="sha256:86f975aca15cf04a40b399eebede9aea7c82eae084d1f1a0a6ef6bcaae871a30"
          export MAYAK_RESTORE_ARCHIVE="synthetic-placeholder/backup.dump"
          export MAYAK_SECRETS_ROOT="$RUNNER_TEMP/rf26-secrets"
          install -d -m 700 "$MAYAK_SECRETS_ROOT"
          for name in mayak_postgres_bootstrap_password_postgres mayak_postgres_bootstrap_password_runtime mayak_database_application_password mayak_session_signing_key mayak_database_migration_password; do
            printf 'rf26-synthetic-only-%s' "$name" > "$MAYAK_SECRETS_ROOT/$name"
            chmod 600 "$MAYAK_SECRETS_ROOT/$name"
          done
          docker compose config >/dev/null
      - name: H7c RF24 workflow boundary
        run: |
          uv run python -m scripts.runtime.check_rf24_backup_restore_workflow .github/workflows/ci-rf24-backup-restore.yml
      - name: H8 task-owned PostgreSQL databases and current migration
        run: |
          set -euo pipefail
          source_db="rf26_source_${GITHUB_RUN_ID}"
          target_db="rf26_target_${GITHUB_RUN_ID}"
          conflict_db="rf26_conflict_${GITHUB_RUN_ID}"
          printf 'RF26_SOURCE_DB=%s\nRF26_TARGET_DB=%s\nRF26_CONFLICT_DB=%s\n' "$source_db" "$target_db" "$conflict_db" >> "$GITHUB_ENV"
          uv run python - "$source_db" "$target_db" "$conflict_db" <<'PY'
          import sys, psycopg
          from psycopg import sql
          with psycopg.connect("host=mayak-postgres dbname=postgres user=mayak password=rf26-bootstrap-only", autocommit=True) as c:
              with c.cursor() as cur:
                  cur.execute("CREATE ROLE mayak_migration LOGIN PASSWORD 'rf26-migration-only' CREATEDB")
                  cur.execute("CREATE ROLE mayak_application LOGIN PASSWORD 'rf26-application-only'")
                  for name in sys.argv[1:]:
                      cur.execute(sql.SQL("CREATE DATABASE {} OWNER mayak_migration").format(sql.Identifier(name)))
          PY
          for db in "$source_db" "$target_db" "$conflict_db"; do
            uv run python - "$db" <<'PY'
          import sys, psycopg
          with psycopg.connect(f"host=mayak-postgres dbname={sys.argv[1]} user=mayak_migration password=rf26-migration-only", autocommit=True) as c:
              with c.cursor() as cur: cur.execute("CREATE SCHEMA mayak AUTHORIZATION mayak_migration")
          PY
          done
          RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:rf26-migration-only@mayak-postgres:5432/$source_db" uv run alembic upgrade head
          RF15_MIGRATION_DSN="postgresql+psycopg://mayak_migration:rf26-migration-only@mayak-postgres:5432/$conflict_db" uv run alembic upgrade head
          uv run python - "$source_db" "$conflict_db" <<'PY'
          import sys, psycopg
          for db in sys.argv[1:]:
              with psycopg.connect(f"host=mayak-postgres dbname={db} user=mayak_migration password=rf26-migration-only", autocommit=True) as c:
                  with c.cursor() as cur:
                      cur.execute("GRANT USAGE ON SCHEMA mayak TO mayak_application")
                      cur.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA mayak TO mayak_application")
                      cur.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA mayak TO mayak_application")
          PY
      - name: H8 current-run accepted runtime seed
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rf26-secrets"
          printf '%s' rf26-application-only > "$RUNNER_TEMP/rf26-secrets/mayak_database_application_password"
          chmod 600 "$RUNNER_TEMP/rf26-secrets/mayak_database_application_password"
          MAYAK_RUNTIME_PROFILE=synthetic_acceptance MAYAK_DATABASE_HOST=mayak-postgres MAYAK_DATABASE_NAME="$RF26_SOURCE_DB" MAYAK_DATABASE_APPLICATION_USER=mayak_application MAYAK_DATABASE_MIGRATION_USER=mayak_migration MAYAK_SECRETS_DIR="$RUNNER_TEMP/rf26-secrets" uv run python -m scripts.runtime.run_rf24_vertical_spine --repo-root "$GITHUB_WORKSPACE" --output rf26-source-runtime-seed.json --probes rf26-source-runtime-probes.json --log rf26-source-runtime.log --source-sha "$GITHUB_SHA"
      - name: H9 bind PostgreSQL 18 client identity
        run: |
          set -euo pipefail
          test -n "${RF26_POSTGRES_CONTAINER:-}"
          container="$RF26_POSTGRES_CONTAINER"
          test -n "$container"
          docker exec -i -u postgres "$container" sh -c 'umask 077; printf "%s\n" "*:*:*:mayak_migration:rf26-migration-only" > /tmp/rf26.pgpass'
          docker exec "$container" pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
          docker exec "$container" pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 18\.'
          printf 'RF24_PG_TOOL_PREFIX=docker exec -i -u postgres -e PGPASSFILE=/tmp/rf26.pgpass %s\n' "$container" >> "$GITHUB_ENV"
      - name: H8 actual rebuild-from-zero stage
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          export RF26_SOURCE_DSN="postgresql://mayak_migration:rf26-migration-only@mayak-postgres:5432/$RF26_SOURCE_DB"
          export RF26_TARGET_DSN="postgresql://mayak_migration:rf26-migration-only@mayak-postgres:5432/$RF26_TARGET_DB"
          export RF26_CONFLICT_DSN="postgresql://mayak_migration:rf26-migration-only@mayak-postgres:5432/$RF26_CONFLICT_DB"
          printf 'RF26_SOURCE_DSN=%s\nRF26_TARGET_DSN=%s\nRF26_CONFLICT_DSN=%s\n' "$RF26_SOURCE_DSN" "$RF26_TARGET_DSN" "$RF26_CONFLICT_DSN" >> "$GITHUB_ENV"
          uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H8_REBUILD_FROM_ZERO --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H8.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H9 actual PostgreSQL backup stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H9_BACKUP --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H9.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H10 actual isolated restore and semantic equivalence stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H10_RESTORE_SEMANTIC_EQUIVALENCE --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H10.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H11 actual API restart stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H11_API_RESTART --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H11.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H12 actual worker interruption and restart stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H12_WORKER_INTERRUPTION_RESTART --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H12.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H13 actual scheduler restart stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H13_SCHEDULER_RESTART --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H13.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H14 actual interrupted migration stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H14_INTERRUPTED_MIGRATION --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H14.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H15 actual outbox reconciliation stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H15_OUTBOX_RECONCILIATION --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H15.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H16 actual retention RPO/RTO stage
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --stage H16_RETENTION_RPO_RTO --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-H16.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H17 security and redaction scan
        run: |
          set -euo pipefail
          uv run python -m scripts.runtime.check_rf24_backup_restore_artifact_safety --help >/dev/null
          ! rg -n --hidden --glob '!*.pyc' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|Authorization:[[:space:]]*Bearer|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@)' rf26-receipts
      - name: H18 aggregate actual stage receipts
        run: uv run python -m scripts.runtime.run_rf26_operability_acceptance --aggregate --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --environment-id "rf26-${GITHUB_RUN_ID}" --output rf26-evidence.json --current-run "$RUNNER_TEMP/rf26-current-run.json" --receipts-dir rf26-receipts --source-dsn-env RF26_SOURCE_DSN --target-dsn-env RF26_TARGET_DSN --conflict-dsn-env RF26_CONFLICT_DSN --backup "$RUNNER_TEMP/rf26-backup.dump" --seed-evidence rf26-source-runtime-seed.json
      - name: H18 exact artifact pre-scan
        run: uv run python scripts/runtime/verify_rf26_operability_acceptance.py --evidence rf26-evidence.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --result rf26-verifier.json
      - name: H19 full repository pytest exactly once
        run: uv run pytest -q
      - name: H20-H22 verifier and final safe manifest
        run: |
          set -euo pipefail
          mkdir -p rf26-evidence
          cp rf26-evidence.json rf26-evidence/acceptance.json
          cp rf26-verifier.json rf26-evidence/verifier.json
          uv run python scripts/runtime/verify_rf26_operability_acceptance.py --evidence rf26-evidence/acceptance.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --result rf26-evidence/final-verifier.json
          uv run python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("rf26-evidence")
          files = []
          for path in sorted(root.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              files.append({"filename": path.name, "size": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          manifest = {"schema_version": 1, "technical_id": "RF26-OBSERVABILITY-BACKUP-RECOVERY-01", "source_sha": os.environ["GITHUB_SHA"], "hosted_run_id": os.environ["GITHUB_RUN_ID"], "raw_backup_excluded": True, "files": files, "self_entry": "artifact-manifest.json is excluded because a file cannot contain its own final digest"}
          (root / "artifact-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY
          test ! -e "$RUNNER_TEMP/rf26-backup.dump"
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.runtime.rf24_backup_restore_core import scan_paths
          root = Path("rf26-evidence")
          paths = sorted(root.iterdir())
          report = scan_paths(paths)
          if report["finding_count"]:
              raise SystemExit(report)
          (root / "artifact-safety.json").write_text(__import__("json").dumps(report, sort_keys=True, indent=2) + "\n")
          PY
      - name: H23 upload exact safe set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rf26-safe-evidence-${{ github.sha }}
          path: rf26-evidence/
