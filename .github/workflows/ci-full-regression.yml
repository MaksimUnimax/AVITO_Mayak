name: Canonical DB-backed full regression

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: python:3.14.6-bookworm@sha256:ec1b01f92099324b965a51c8547d9a3b71fedc99f6991a89662e7358f9b167c9
    services:
      postgres:
        image: postgres:18-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      UV_NO_SYSTEM_CONFIG: "1"
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.31
          python-version: 3.14.6
          activate-environment: true
          venv-path: .venv
          enable-cache: false
      - name: Frozen all-groups sync
        run: uv sync --frozen --all-groups --python 3.14.6
      - name: Provision task-owned RF10/RF11 foundation
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/mayak-ci-full-${GITHUB_RUN_ID}"
          python scripts/ci/provision_full_regression.py provision --run-id "$GITHUB_RUN_ID" --state "$state" --root "$GITHUB_WORKSPACE"
          cat "$state/full-regression.env" >> "$GITHUB_ENV"
          printf 'MAYAK_CI_FULL_STATE=%s\n' "$state" >> "$GITHUB_ENV"
      - name: Validate canonical database contract
        run: |
          set -euo pipefail
          test "$MAYAK_PROVIDER_MODE" = disabled
          test -f "$MAYAK_RF11_POSTGRES_PASSWORD_FILE"
          test "$(stat -c '%a' "$MAYAK_RF11_POSTGRES_PASSWORD_FILE")" = 600
          test -n "$MAYAK_RF10_POSTGRES_DSN" -a "$MAYAK_RF11_POSTGRES_DB" != mayak
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["MAYAK_CI_FULL_STATE"]) / "migration-receipt.json").read_text())
          assert len(receipt["databases"]) == 2
          assert all(row["status"] == "PASS" and row["expected_revision"] == row["observed_revision"] for row in receipt["databases"])
          forbidden = ("dsn", "password", "token", "authorization", "secret")
          assert not any(any(term in str(key).lower() for term in forbidden) for row in receipt["databases"] for key in row)
          PY
          ! env | grep -E '^(RF18|RF19|RF24|MAYAK_RF18|MAYAK_RF19|MAYAK_RF24)'
      - name: Complete unfiltered repository pytest with coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/avito-mayak-${{ github.run_id }}.coverage
          COVERAGE_JSON: ${{ runner.temp }}/avito-mayak-${{ github.run_id }}.coverage.json
          PYTEST_LOG: ${{ runner.temp }}/avito-mayak-${{ github.run_id }}.pytest.log
        run: |
          set -euo pipefail
          uv run coverage run --branch -m pytest -q --disable-warnings 2>&1 | tee "$PYTEST_LOG"
          uv run coverage json -o "$COVERAGE_JSON"
          uv run coverage report
          python scripts/ci/verify_coverage_baseline.py "$COVERAGE_JSON" --pytest-log "$PYTEST_LOG" --comparison-base "5359921e2aedcc567363a9f2e9d47461459fef3b"
      - name: Cleanup exact task-owned database state
        if: always()
        run: |
          if test -n "${MAYAK_CI_FULL_STATE:-}"; then
            python scripts/ci/provision_full_regression.py cleanup --run-id "$GITHUB_RUN_ID" --state "$MAYAK_CI_FULL_STATE"
          fi
